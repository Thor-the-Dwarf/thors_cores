<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=10, user-scalable=yes">
  <title>Artefakte · TheRealDeal</title>
  <style>
    :root {
      color-scheme: dark;
      --hintergrund: #090d1b;
      --text: #f6f7fb;
      --linie: rgba(183, 195, 220, 0.2);
      --cyan: #46d7ff;
      --top-app-bar-höhe: calc(52px + env(safe-area-inset-top, 0px));
      --seiten-navigation-höhe: 60px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background: var(--hintergrund);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .top-app-bar {
      position: fixed;
      z-index: 100;
      inset: 0 0 auto;
      display: grid;
      place-items: center;
      width: 100vw;
      min-height: var(--top-app-bar-höhe);
      padding: calc(8px + env(safe-area-inset-top, 0px))
        max(12px, env(safe-area-inset-right, 0px))
        8px
        max(12px, env(safe-area-inset-left, 0px));
      border-bottom: 1px solid rgba(183, 195, 220, 0.2);
      color: #eef2f9;
      background: rgba(10, 14, 23, 0.96);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
      touch-action: pan-x pan-y pinch-zoom;
    }

    .top-app-bar__text {
      margin: 0;
      font-size: clamp(0.78rem, 2.4vw, 0.92rem);
      font-weight: 850;
      line-height: 1.25;
      text-align: center;
    }

    .zurück {
      position: fixed;
      z-index: 2;
      top: calc(var(--top-app-bar-höhe) + 8px);
      left: max(16px, env(safe-area-inset-left));
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(180, 205, 239, 0.34);
      border-radius: 999px;
      color: rgba(246, 247, 251, 0.92);
      background: rgba(10, 14, 23, 0.88);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
      font-weight: 850;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .zurück:hover,
    .zurück:focus-visible {
      border-color: rgba(70, 215, 255, 0.7);
      outline: none;
    }

    .artefakte-raster {
      width: 100%;
      height: calc(100vh - var(--top-app-bar-höhe) - var(--seiten-navigation-höhe));
      height: calc(100dvh - var(--top-app-bar-höhe) - var(--seiten-navigation-höhe));
      margin-top: calc(var(--top-app-bar-höhe) + var(--seiten-navigation-höhe));
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      overflow: hidden;
    }

    .artefakt-bereich {
      min-width: 0;
      min-height: 0;
      padding: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      place-items: stretch;
      overflow: hidden;
      border: 0 solid var(--linie);
      border-right-width: 1px;
      border-bottom-width: 1px;
      background:
        radial-gradient(circle at 50% 38%, rgba(70, 215, 255, 0.06), transparent 65%),
        rgba(17, 27, 43, 0.78);
    }

    .artefakt-bereich:nth-child(2),
    .artefakt-bereich:nth-child(5) {
      background:
        radial-gradient(circle at 50% 38%, rgba(156, 102, 239, 0.09), transparent 65%),
        rgba(20, 25, 43, 0.82);
    }

    .artefakt-bereich:nth-child(3),
    .artefakt-bereich:nth-child(4) {
      background:
        radial-gradient(circle at 50% 38%, rgba(37, 99, 235, 0.09), transparent 65%),
        rgba(14, 25, 43, 0.82);
    }

    .artefakt-titel {
      margin: 0;
      padding: 16px 18px;
      border-bottom: 1px solid var(--linie);
      font-size: clamp(1.05rem, 2.3vw, 1.75rem);
      font-weight: 850;
      line-height: 1.2;
      text-align: center;
    }

    .artefakt-bereich--geteilt {
      padding: 0;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr));
      place-items: stretch;
    }

    .artefakt-unterbereich {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .artefakt-unterbereich + .artefakt-unterbereich {
      border-top: 1px solid var(--linie);
      background: rgba(156, 102, 239, 0.06);
    }

    .artefakt-baum {
      min-height: 0;
      padding: 10px 12px 18px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(126, 53, 216, 0.72) transparent;
    }

    .artefakt-baum details {
      margin: 4px 0;
    }

    .artefakt-baum summary {
      padding: 7px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 9px;
      color: rgba(246, 247, 251, 0.9);
      background: rgba(255, 255, 255, 0.035);
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    .artefakt-baum summary::-webkit-details-marker {
      display: none;
    }

    .artefakt-baum summary::before {
      content: "›";
      color: var(--cyan);
      font-size: 1rem;
      transform: rotate(0deg);
      transition: transform 120ms ease;
    }

    .artefakt-baum details[open] > summary::before {
      transform: rotate(90deg);
    }

    .artefakt-baum ul {
      margin: 2px 0 6px 11px;
      padding: 0 0 0 12px;
      border-left: 1px solid rgba(183, 195, 220, 0.16);
      list-style: none;
    }

    .artefakt-baum li {
      position: relative;
      padding: 5px 4px 5px 13px;
      color: rgba(226, 232, 242, 0.78);
      font-size: 0.72rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .artefakt-baum li::before {
      content: "";
      position: absolute;
      top: 0.9em;
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(70, 215, 255, 0.68);
    }

    @media (max-width: 700px) {
      .artefakte-raster {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
      }

      .artefakt-bereich {
        padding: 0;
      }

      .artefakt-bereich--geteilt {
        padding: 0;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }

      .artefakt-unterbereich {
        padding: 0;
      }

      .artefakt-unterbereich + .artefakt-unterbereich {
        border-top: 1px solid var(--linie);
        border-left: 0;
      }

      .artefakt-titel {
        padding: 10px 8px;
        font-size: clamp(0.8rem, 3.8vw, 1.1rem);
      }

      .artefakt-baum {
        padding: 6px 7px 12px;
      }

      .artefakt-baum summary {
        padding: 6px;
        font-size: 0.7rem;
      }

      .artefakt-baum ul {
        margin-left: 7px;
        padding-left: 8px;
      }

      .artefakt-baum li {
        padding: 4px 2px 4px 10px;
        font-size: 0.64rem;
      }
    }
  </style>
</head>
