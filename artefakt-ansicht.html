<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artefaktansicht · Thors Core</title>
  <style>
    :root {
      color-scheme: dark;
      --hintergrund: #080d18;
      --fläche: #111a2b;
      --text: #f5f7fb;
      --leise: #9cabc1;
      --cyan: #46d7ff;
      --violett: #9c66ef;
      --top-app-bar-höhe: calc(52px + env(safe-area-inset-top, 0px));
      --app-bar-höhe: calc(62px + env(safe-area-inset-bottom, 0px));
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgba(70, 215, 255, 0.09), transparent 34rem),
        var(--hintergrund);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .top-app-bar {
      position: fixed;
      z-index: 20;
      inset: 0 0 auto;
      min-height: var(--top-app-bar-höhe);
      padding: calc(8px + env(safe-area-inset-top, 0px)) 64px 8px 16px;
      display: grid;
      place-items: center;
      border-bottom: 1px solid rgba(183, 195, 220, 0.2);
      background: rgba(10, 14, 23, 0.96);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
    }

    .top-app-bar__text {
      margin: 0;
      font-size: clamp(0.78rem, 2.4vw, 0.92rem);
      font-weight: 850;
      text-align: center;
    }

    main {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: calc(var(--top-app-bar-höhe) + 28px) 0 calc(var(--app-bar-höhe) + 34px);
    }

    .kopf {
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 14px 18px;
      align-items: center;
    }

    .zurück {
      min-height: 44px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(183, 195, 220, 0.3);
      border-radius: 999px;
      color: var(--text);
      background: rgba(17, 26, 43, 0.78);
      font-weight: 800;
      text-decoration: none;
    }

    .überschrift {
      min-width: 0;
    }

    .form {
      margin: 0 0 5px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2.55rem);
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .metadaten {
      grid-column: 2;
      margin: 0;
      color: var(--leise);
      font-size: 0.85rem;
    }

    .vorschau {
      overflow: hidden;
      border: 1px solid rgba(183, 195, 220, 0.2);
      border-radius: 22px;
      background: rgba(17, 26, 43, 0.78);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .vorschau__leiste {
      min-height: 48px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(183, 195, 220, 0.15);
      color: var(--leise);
      font-size: 0.76rem;
      font-weight: 750;
    }

    .status {
      padding: 5px 9px;
      border: 1px solid rgba(70, 215, 255, 0.28);
      border-radius: 999px;
      color: #c8f4ff;
      background: rgba(70, 215, 255, 0.08);
    }

    .dokument {
      padding: clamp(14px, 3vw, 30px);
      background:
        linear-gradient(135deg, rgba(156, 102, 239, 0.055), transparent 42%),
        #0b1220;
    }

    .dokument svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 13px;
      background: #f7f8fb;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
    }

    .hinweis {
      margin: 16px 4px 0;
      color: var(--leise);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .fehler {
      padding: 30px;
      border: 1px solid rgba(255, 99, 132, 0.3);
      border-radius: 18px;
      background: rgba(255, 99, 132, 0.08);
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 20px, 1100px);
      }

      .kopf {
        grid-template-columns: 1fr;
      }

      .zurück {
        width: max-content;
      }

      .metadaten {
        grid-column: 1;
      }
    }
  </style>
  <link rel="stylesheet" href="app-navigation.css">
</head>

  <script>
    (async () => {
      "use strict";

      const FORMEN = {
        bpmn: "BPMN-Prozessmodell", css: "Stylesheet", csv: "CSV-Datei",
        docx: "Textdokument", drawio: "Diagrammdatei", html: "HTML-Dokument",
        ini: "Konfigurationsdatei", json: "JSON-Datei", md: "Markdown-Dokument",
        puml: "PlantUML-Diagramm", py: "Python-Datei", sql: "SQL-Datei",
        txt: "Textdatei", xlsx: "Arbeitsmappe"
      };
      const BEREICHE = {
        analysen: "Analyse-Tools", plaene: "Planungs-Tools",
        umsetzung: "Umsetzungs-Tools", tests: "Test-Tools",
        abschluss: "Abschluss-Tools", qualitaet: "Qualitätsvorgaben",
        wartung: "Wartungs-Tools"
      };
      const parameter = new URLSearchParams(location.search);
      const dateiname = parameter.get("datei") || "";
      const bereich = parameter.get("bereich") || "";
      const relevant = parameter.get("relevant") === "true";
      const endung = dateiname.match(/\.([^.]+)$/)?.[1].toLowerCase() || "";
      const form = FORMEN[endung];
      const zweck = dokumentzweck(dateiname);

      const istBekannteVorlage = await artefaktIstBekannt(
        dateiname,
        bereich,
        relevant
      );
      if (!dateiname || !form || !BEREICHE[bereich] || !zweck || !istBekannteVorlage) {
        document.querySelector("#inhalt").innerHTML =
          '<div class="fehler"><h1>Artefakt nicht gefunden</h1>' +
          '<p>Diese Ansichtsadresse gehört zu keiner unterstützten Vorlage.</p>' +
          '<a class="zurück" href="artefakte.html">← Zur Artefaktübersicht</a></div>';
        return;
      }

      document.title = `${zweck} · Artefaktansicht`;
      document.querySelector("#form").textContent = form;
      document.querySelector("#titel").textContent = zweck;
      document.querySelector("#metadaten").textContent =
        `${BEREICHE[bereich]} · Verifizierte Dokumentvorlage`;
      document.querySelector("#status").textContent = relevant
        ? "🔥 prüfungsrelevant"
        : "Anschauungsmaterial";
      document.querySelector("#svg-form").textContent = form;
      document.querySelector("#svg-zweck").textContent = kürzen(zweck, 56);
      document.querySelector("#svg-titel").textContent = `${form}: ${zweck}`;

      const ansicht = ansichtFür(dateiname, endung);
      document.querySelectorAll("#dokumentgrafik > g").forEach(gruppe => {
        gruppe.style.display = gruppe.id === `ansicht-${ansicht}` ? "block" : "none";
      });

      function ansichtFür(name, dateiendung) {
        const titel = name.toLowerCase();
        if (/checkliste|vollständigkeitscheck/.test(titel)) return "checkliste";
        if (/testfall|testprotokoll|nachtest|abnahme/.test(titel)) return "test";
        if (["bpmn", "drawio", "puml"].includes(dateiendung)) return "diagramm";
        if (["xlsx", "csv"].includes(dateiendung)) return "tabelle";
        if (["css", "html", "ini", "json", "py", "sql"].includes(dateiendung)) return "code";
        return "text";
      }

      async function artefaktIstBekannt(name, bereichsschlüssel, istRelevant) {
        try {
          const übersicht = await fetch("artefakte.html").then(antwort => {
            if (!antwort.ok) throw new Error("Artefaktkatalog nicht erreichbar");
            return antwort.text();
          });
          const katalogTreffer = übersicht.match(
            /const baumDaten = (\{[\s\S]*?\n      \});\n\n      const FACHRICHTUNG/
          );
          if (!katalogTreffer) return false;
          const katalog = Function(`"use strict"; return (${katalogTreffer[1]})`)();
          const gruppe = istRelevant ? "Prüfungsrelevante" : "Weitere";
          return katalog[bereichsschlüssel]?.[gruppe]?.includes(name) === true;
        } catch {
          return false;
        }
      }

      function dokumentzweck(name) {
        const roh = name.replace(/^_+/, "").replace(/\.[^.]+$/, "").replace(/_/g, " ");
        const testfall = roh.match(/^Testfall (.+)$/i);
        if (testfall) return `Testfallbeschreibung – ${testfall[1]}`;
        if (/^FIAE test /i.test(roh)) return roh.replace(/^FIAE test /i, "FIAE Test – ");
        if (/^beispiel import$/i.test(roh)) return "Beispieldaten für den Import";
        if (/^beispiel export$/i.test(roh)) return "Beispieldaten für den Export";
        if (/^demo daten$/i.test(roh)) return "Demodaten";
        if (/^pytest$/i.test(roh)) return "Pytest-Konfiguration";
        return roh;
      }

      function kürzen(text, länge) {
        return text.length > länge ? `${text.slice(0, länge - 1)}…` : text;
      }
    })();
  </script>
