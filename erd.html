<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=10, user-scalable=yes">
  <meta name="description" content="Dynamisches ERD der aktuellen TheRealDeal-JSON-Daten">
  <title>ERD · TheRealDeal</title>
  <style>
    :root {
      color-scheme: dark;
      --hintergrund: #070a11;
      --fläche: #121826;
      --fläche-hell: #1b2435;
      --text: #eef2f9;
      --gedimmt: #9ba8bc;
      --linie: #526079;
      --bezug: #82a6ff;
      --fehler: #f87171;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background: var(--hintergrund);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: auto;
    }

    header {
      position: sticky;
      z-index: 20;
      top: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(183, 195, 220, 0.18);
      background: rgba(10, 14, 23, 0.96);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: clamp(0.9rem, 2vw, 1.08rem);
      text-align: center;
    }

    header a,
    header button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border: 1px solid rgba(183, 195, 220, 0.2);
      border-radius: 10px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }

    header a:hover,
    header a:focus-visible,
    header button:hover,
    header button:focus-visible {
      border-color: rgba(130, 166, 255, 0.52);
      background: rgba(130, 166, 255, 0.12);
      outline: none;
    }

    .status {
      margin: 0;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(183, 195, 220, 0.12);
      color: var(--gedimmt);
      background: rgba(13, 18, 29, 0.82);
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
    }

    .status[data-zustand="fehler"] {
      color: #fecaca;
      background: rgba(127, 29, 29, 0.28);
    }

    .diagramm-scroll {
      width: 100%;
      height: max(440px, calc(100vh - 116px));
      overflow: hidden;
      cursor: grab;
      overscroll-behavior: contain;
      touch-action: auto;
    }

    .diagramm-scroll.zieht {
      cursor: grabbing;
    }

    .diagramm {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(220px, 1fr));
      grid-template-rows: repeat(3, auto);
      gap: 74px 58px;
      width: max(1400px, 100%);
      min-height: 1040px;
      padding: 48px;
      isolation: isolate;
      transform-origin: 0 0;
      will-change: transform;
    }

    .verbindungen {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .verbindungen path {
      fill: none;
      stroke: rgba(130, 166, 255, 0.58);
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
    }

    .verbindungen text {
      fill: #cbd8ef;
      stroke: #070a11;
      stroke-width: 5px;
      paint-order: stroke;
      font-size: 11px;
      font-weight: 750;
      text-anchor: middle;
    }

    .verbindungen .beziehungslabel rect {
      fill: rgba(7, 10, 17, 0.94);
      stroke: rgba(130, 166, 255, 0.32);
      stroke-width: 1px;
      rx: 5px;
    }

    .entität {
      position: relative;
      z-index: 1;
      align-self: start;
      min-width: 0;
      border: 1px solid var(--linie);
      border-radius: 12px;
      overflow: hidden;
      background: var(--fläche);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    .entität header {
      position: static;
      display: block;
      min-height: 0;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--linie);
      background: var(--fläche-hell);
      backdrop-filter: none;
    }

    .entität h2 {
      margin: 0;
      font-size: 0.88rem;
    }

    .entität-meta {
      margin: 3px 0 0;
      color: var(--gedimmt);
      font-size: 0.66rem;
      font-weight: 700;
    }

    .felder {
      margin: 0;
      padding: 8px 0;
      list-style: none;
    }

    .felder li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 11px;
      color: #dce4f1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.68rem;
      line-height: 1.3;
    }

    .felder li[data-referenz="true"] {
      color: #b9ceff;
    }

    .feld-typ {
      flex: 0 0 auto;
      color: #7f8ca1;
    }

    .beziehungen {
      padding: 0 16px 28px;
    }

    .beziehungen h2 {
      margin: 0 0 10px;
      font-size: 0.88rem;
    }

    .beziehungen ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .beziehungen li {
      padding: 8px 10px;
      border: 1px solid rgba(183, 195, 220, 0.14);
      border-radius: 8px;
      color: #cbd5e4;
      background: rgba(255, 255, 255, 0.025);
      font-size: 0.7rem;
      line-height: 1.4;
    }

    .beziehungen li[data-ungültig="true"] {
      border-color: rgba(248, 113, 113, 0.48);
      color: #fecaca;
    }

    @media (max-width: 600px) {
      header {
        grid-template-columns: auto minmax(0, 1fr);
      }

      header button {
        grid-column: 1 / -1;
        min-height: 34px;
      }

      .status {
        text-align: left;
      }

      .diagramm {
        gap: 62px 42px;
        width: 1060px;
        min-height: 860px;
        padding: 34px 26px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Vault</a>
    <h1>Dynamisches ERD des Lern-Vaults</h1>
    <button id="neu-laden" type="button">JSON neu laden</button>
  </header>
  <p id="schema-status" class="status" role="status">Aktuelle JSON-Dateien werden ausgewertet …</p>
  <main>
    <div id="diagramm-viewport" class="diagramm-scroll">
      <section id="diagramm" class="diagramm" aria-label="Entity-Relationship-Diagramm">
        <svg id="verbindungen" class="verbindungen" aria-hidden="true">
          <defs>
            <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#82a6ff"></path>
            </marker>
          </defs>
        </svg>
      </section>
    </div>
    <section class="beziehungen" aria-labelledby="beziehungen-titel">
      <h2 id="beziehungen-titel">Aus den JSON-Referenzen abgeleitete Beziehungen</h2>
      <ul id="beziehungsliste"></ul>
    </section>
  </main>

  <script>
    (async () => {
      "use strict";

      const status = document.querySelector("#schema-status");
      const diagrammViewport = document.querySelector("#diagramm-viewport");
      const diagramm = document.querySelector("#diagramm");
      const verbindungen = document.querySelector("#verbindungen");
      const beziehungsliste = document.querySelector("#beziehungsliste");
      const SVG_NS = "http://www.w3.org/2000/svg";
      let canvasZoom = 1;
      let canvasX = 0;
      let canvasY = 0;
      let canvasZug = null;

      function canvasTransformationAnwenden() {
        diagramm.style.transform =
          `translate(${canvasX}px, ${canvasY}px) scale(${canvasZoom})`;
        diagramm.dataset.zoom = canvasZoom.toFixed(3);
        diagramm.dataset.verschiebungX = canvasX.toFixed(1);
        diagramm.dataset.verschiebungY = canvasY.toFixed(1);
      }

      function canvasEinpassen() {
        const rand = 28;
        canvasZoom = Math.max(0.22, Math.min(
          1,
          (diagrammViewport.clientWidth - rand * 2) / Math.max(1, diagramm.offsetWidth),
          (diagrammViewport.clientHeight - rand * 2) / Math.max(1, diagramm.offsetHeight)
        ));
        canvasX = (diagrammViewport.clientWidth - diagramm.offsetWidth * canvasZoom) / 2;
        canvasY = (diagrammViewport.clientHeight - diagramm.offsetHeight * canvasZoom) / 2;
        canvasTransformationAnwenden();
      }

      diagrammViewport.addEventListener("wheel", ereignis => {
        if (ereignis.ctrlKey || ereignis.metaKey) return;
        ereignis.preventDefault();
        const rechteck = diagrammViewport.getBoundingClientRect();
        const fokusX = ereignis.clientX - rechteck.left;
        const fokusY = ereignis.clientY - rechteck.top;
        const weltX = (fokusX - canvasX) / canvasZoom;
        const weltY = (fokusY - canvasY) / canvasZoom;
        canvasZoom = Math.max(
          0.18,
          Math.min(2.4, canvasZoom * Math.exp(-ereignis.deltaY * 0.0014))
        );
        canvasX = fokusX - weltX * canvasZoom;
        canvasY = fokusY - weltY * canvasZoom;
        canvasTransformationAnwenden();
      }, { passive: false });

      diagrammViewport.addEventListener("pointerdown", ereignis => {
        if (ereignis.button !== 0 || ereignis.pointerType === "touch") return;
        ereignis.preventDefault();
        canvasZug = {
          pointerId: ereignis.pointerId,
          startX: ereignis.clientX,
          startY: ereignis.clientY,
          ursprungX: canvasX,
          ursprungY: canvasY
        };
        diagrammViewport.classList.add("zieht");
        diagrammViewport.setPointerCapture(ereignis.pointerId);
      });

      diagrammViewport.addEventListener("pointermove", ereignis => {
        if (!canvasZug || ereignis.pointerId !== canvasZug.pointerId) return;
        canvasX = canvasZug.ursprungX + ereignis.clientX - canvasZug.startX;
        canvasY = canvasZug.ursprungY + ereignis.clientY - canvasZug.startY;
        canvasTransformationAnwenden();
      });

      function canvasZugBeenden(ereignis) {
        if (!canvasZug || ereignis.pointerId !== canvasZug.pointerId) return;
        canvasZug = null;
        diagrammViewport.classList.remove("zieht");
      }

      diagrammViewport.addEventListener("pointerup", canvasZugBeenden);
      diagrammViewport.addEventListener("pointercancel", canvasZugBeenden);

      document.querySelector("#neu-laden").addEventListener("click", () => location.reload());

      function wertTyp(items, feld) {
        const wert = items.map(item => item[feld]).find(item => item !== null && item !== undefined);
        if (Array.isArray(wert)) return "Array";
        if (wert && typeof wert === "object") return "Objekt";
        if (wert === undefined) return "unbekannt";
        return typeof wert;
      }

      function felderErmitteln(items) {
        const felder = [];
        const gesehen = new Set();
        items.slice(0, 40).forEach(item => {
          Object.keys(item).forEach(feld => {
            if (gesehen.has(feld)) return;
            gesehen.add(feld);
            felder.push({ name: feld, typ: wertTyp(items, feld) });
          });
        });
        return felder;
      }

      function istReferenz(feld) {
        return feld.endsWith("_ref")
          || feld.endsWith("_refs")
          || feld === "source_refs"
          || feld === "category_weights";
      }

      function entitätRendern(spezifikation) {
        const artikel = document.createElement("article");
        artikel.className = "entität";
        artikel.dataset.entität = spezifikation.id;
        artikel.style.gridColumn = spezifikation.spalte;
        artikel.style.gridRow = spezifikation.zeile;

        const kopf = document.createElement("header");
        const titel = document.createElement("h2");
        const meta = document.createElement("p");
        const liste = document.createElement("ul");
        titel.textContent = spezifikation.titel;
        meta.className = "entität-meta";
        meta.textContent = `${spezifikation.datei} · ${spezifikation.items.length} Einträge`;
        liste.className = "felder";

        felderErmitteln(spezifikation.items).forEach(feld => {
          const eintrag = document.createElement("li");
          const name = document.createElement("span");
          const typ = document.createElement("span");
          eintrag.dataset.referenz = String(istReferenz(feld.name));
          name.textContent = feld.name;
          typ.className = "feld-typ";
          typ.textContent = feld.typ;
          eintrag.append(name, typ);
          liste.append(eintrag);
        });

        kopf.append(titel, meta);
        artikel.append(kopf, liste);
        diagramm.append(artikel);
      }

      function beziehungenRendern(beziehungen) {
        beziehungsliste.textContent = "";
        beziehungen.forEach(beziehung => {
          const eintrag = document.createElement("li");
          eintrag.dataset.ungültig = String(beziehung.ungültig > 0);
          eintrag.textContent =
            `${beziehung.vonTitel} → ${beziehung.zuTitel} · ${beziehung.feld} · ` +
            `${beziehung.anzahl} Bezüge` +
            (beziehung.ungültig ? ` · ${beziehung.ungültig} nicht auflösbar` : "");
          beziehungsliste.append(eintrag);
        });
      }

      function rechteckÜberschneidung(a, b, rand = 0) {
        const breite = Math.max(
          0,
          Math.min(a.rechts + rand, b.rechts + rand)
            - Math.max(a.links - rand, b.links - rand)
        );
        const höhe = Math.max(
          0,
          Math.min(a.unten + rand, b.unten + rand)
            - Math.max(a.oben - rand, b.oben - rand)
        );
        return breite * höhe;
      }

      function kartenRechtecke() {
        return [...diagramm.querySelectorAll(".entität")].map(element => ({
          links: element.offsetLeft,
          oben: element.offsetTop,
          rechts: element.offsetLeft + element.offsetWidth,
          unten: element.offsetTop + element.offsetHeight
        }));
      }

      function kanteAmRechteck(von, zu, breite, höhe) {
        const dx = zu.x - von.x;
        const dy = zu.y - von.y;
        const faktor = 1 / Math.max(
          Math.abs(dx) / Math.max(1, breite / 2),
          Math.abs(dy) / Math.max(1, höhe / 2),
          1
        );
        return { x: von.x + dx * faktor, y: von.y + dy * faktor };
      }

      function labelPositionFinden(start, ziel, text, karten, verwendeteLabels) {
        const dx = ziel.x - start.x;
        const dy = ziel.y - start.y;
        const länge = Math.max(1, Math.hypot(dx, dy));
        const normalX = -dy / länge;
        const normalY = dx / länge;
        const breite = Math.min(230, Math.max(96, text.length * 6.4 + 18));
        const höhe = 24;
        const kandidaten = [];

        [0.5, 0.4, 0.6, 0.3, 0.7].forEach(t => {
          [0, 26, -26, 48, -48, 72, -72].forEach(abstand => {
            const x = start.x + dx * t + normalX * abstand;
            const y = start.y + dy * t + normalY * abstand;
            const rechteck = {
              links: x - breite / 2,
              rechts: x + breite / 2,
              oben: y - höhe / 2,
              unten: y + höhe / 2
            };
            const kartenKollision = karten.reduce(
              (summe, karte) => summe + rechteckÜberschneidung(rechteck, karte, 10),
              0
            );
            const labelKollision = verwendeteLabels.reduce(
              (summe, label) => summe + rechteckÜberschneidung(rechteck, label, 8),
              0
            );
            kandidaten.push({
              x,
              y,
              breite,
              höhe,
              rechteck,
              wert: kartenKollision * 20
                + labelKollision * 14
                + Math.abs(t - 0.5) * 180
                + Math.abs(abstand) * 0.35
            });
          });
        });
        return kandidaten.sort((a, b) => a.wert - b.wert)[0];
      }

      function verbindungenZeichnen(beziehungen) {
        verbindungen.querySelectorAll("[data-beziehung]").forEach(element => element.remove());
        const karten = kartenRechtecke();
        const verwendeteLabels = [];

        beziehungen.forEach(beziehung => {
          const startElement = diagramm.querySelector(`[data-entität="${beziehung.von}"]`);
          const zielElement = diagramm.querySelector(`[data-entität="${beziehung.zu}"]`);
          if (!startElement || !zielElement) return;

          const startMitte = {
            x: startElement.offsetLeft + startElement.offsetWidth / 2,
            y: startElement.offsetTop + startElement.offsetHeight / 2
          };
          const zielMitte = {
            x: zielElement.offsetLeft + zielElement.offsetWidth / 2,
            y: zielElement.offsetTop + zielElement.offsetHeight / 2
          };
          const start = kanteAmRechteck(
            startMitte,
            zielMitte,
            startElement.offsetWidth,
            startElement.offsetHeight
          );
          const ziel = kanteAmRechteck(
            zielMitte,
            startMitte,
            zielElement.offsetWidth,
            zielElement.offsetHeight
          );
          const text = `${beziehung.feld} (${beziehung.anzahl})`;
          const label = labelPositionFinden(start, ziel, text, karten, verwendeteLabels);
          verwendeteLabels.push(label.rechteck);

          const pfad = document.createElementNS(SVG_NS, "path");
          const gruppe = document.createElementNS(SVG_NS, "g");
          const hintergrund = document.createElementNS(SVG_NS, "rect");
          const beschriftung = document.createElementNS(SVG_NS, "text");
          pfad.dataset.beziehung = beziehung.feld;
          pfad.setAttribute("marker-end", "url(#pfeil)");
          pfad.setAttribute(
            "d",
            `M ${start.x} ${start.y} Q ${label.x} ${label.y} ${ziel.x} ${ziel.y}`
          );
          gruppe.dataset.beziehung = beziehung.feld;
          gruppe.classList.add("beziehungslabel");
          hintergrund.setAttribute("x", String(label.x - label.breite / 2));
          hintergrund.setAttribute("y", String(label.y - label.höhe / 2));
          hintergrund.setAttribute("width", String(label.breite));
          hintergrund.setAttribute("height", String(label.höhe));
          beschriftung.setAttribute("x", String(label.x));
          beschriftung.setAttribute("y", String(label.y + 4));
          beschriftung.textContent = text;
          gruppe.append(hintergrund, beschriftung);
          verbindungen.append(pfad, gruppe);
        });
      }

      function forceLayoutStarten(beziehungen) {
        const elemente = [...diagramm.querySelectorAll(".entität")];
        const knoten = elemente.map(element => {
          const rechteck = element.getBoundingClientRect();
          return {
            id: element.dataset.entität,
            element,
            breite: rechteck.width,
            höhe: rechteck.height,
            x: element.offsetLeft + rechteck.width / 2,
            y: element.offsetTop + rechteck.height / 2,
            vx: 0,
            vy: 0
          };
        });
        const nachId = new Map(knoten.map(knotenpunkt => [knotenpunkt.id, knotenpunkt]));
        const kanten = beziehungen
          .map(beziehung => ({
            a: nachId.get(beziehung.von),
            b: nachId.get(beziehung.zu)
          }))
          .filter(kante => kante.a && kante.b);
        const breite = Math.max(1400, diagramm.clientWidth);
        const höhe = 1040;
        diagramm.style.height = `${höhe}px`;

        elemente.forEach((element, index) => {
          const knotenpunkt = knoten[index];
          element.style.position = "absolute";
          element.style.width = `${knotenpunkt.breite}px`;
          element.style.left = `${knotenpunkt.x - knotenpunkt.breite / 2}px`;
          element.style.top = `${knotenpunkt.y - knotenpunkt.höhe / 2}px`;
        });
        canvasEinpassen();

        let schritt = 0;
        let ruhigeSchritte = 0;
        function simulieren() {
          knoten.forEach(knotenpunkt => {
            knotenpunkt.vx += (breite / 2 - knotenpunkt.x) * 0.0007;
            knotenpunkt.vy += (höhe / 2 - knotenpunkt.y) * 0.0007;
          });

          for (let i = 0; i < knoten.length; i += 1) {
            for (let j = i + 1; j < knoten.length; j += 1) {
              const a = knoten[i];
              const b = knoten[j];
              let dx = b.x - a.x;
              let dy = b.y - a.y;
              const distanz = Math.max(1, Math.hypot(dx, dy));
              const kraft = Math.min(2.8, 18000 / (distanz * distanz));
              dx /= distanz;
              dy /= distanz;
              a.vx -= dx * kraft;
              a.vy -= dy * kraft;
              b.vx += dx * kraft;
              b.vy += dy * kraft;

              const überX = (a.breite + b.breite) / 2 + 42 - Math.abs(b.x - a.x);
              const überY = (a.höhe + b.höhe) / 2 + 42 - Math.abs(b.y - a.y);
              if (überX > 0 && überY > 0) {
                if (überX < überY) {
                  const richtung = Math.sign(b.x - a.x) || 1;
                  a.vx -= richtung * überX * 0.045;
                  b.vx += richtung * überX * 0.045;
                } else {
                  const richtung = Math.sign(b.y - a.y) || 1;
                  a.vy -= richtung * überY * 0.045;
                  b.vy += richtung * überY * 0.045;
                }
              }
            }
          }

          kanten.forEach(({ a, b }) => {
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distanz = Math.max(1, Math.hypot(dx, dy));
            const kraft = (distanz - 330) * 0.0038;
            const kx = dx / distanz * kraft;
            const ky = dy / distanz * kraft;
            a.vx += kx;
            a.vy += ky;
            b.vx -= kx;
            b.vy -= ky;
          });

          let bewegung = 0;
          knoten.forEach(knotenpunkt => {
            knotenpunkt.vx = Math.max(-14, Math.min(14, knotenpunkt.vx * 0.78));
            knotenpunkt.vy = Math.max(-14, Math.min(14, knotenpunkt.vy * 0.78));
            knotenpunkt.x = Math.max(
              36 + knotenpunkt.breite / 2,
              Math.min(breite - 36 - knotenpunkt.breite / 2, knotenpunkt.x + knotenpunkt.vx)
            );
            knotenpunkt.y = Math.max(
              36 + knotenpunkt.höhe / 2,
              Math.min(höhe - 36 - knotenpunkt.höhe / 2, knotenpunkt.y + knotenpunkt.vy)
            );
            knotenpunkt.element.style.left =
              `${knotenpunkt.x - knotenpunkt.breite / 2}px`;
            knotenpunkt.element.style.top =
              `${knotenpunkt.y - knotenpunkt.höhe / 2}px`;
            bewegung += Math.abs(knotenpunkt.vx) + Math.abs(knotenpunkt.vy);
          });

          verbindungenZeichnen(beziehungen);
          schritt += 1;
          ruhigeSchritte = bewegung < 0.28 ? ruhigeSchritte + 1 : 0;
          if (schritt < 220 && ruhigeSchritte < 12) {
            requestAnimationFrame(simulieren);
          } else {
            diagramm.dataset.layout = "bereit";
          }
        }
        requestAnimationFrame(simulieren);
      }

      function referenzenPrüfen(vonMenge, items, feld) {
        const werte = items.map(item => item[feld]).filter(Boolean);
        return {
          anzahl: werte.length,
          ungültig: werte.filter(wert => !vonMenge.has(wert)).length
        };
      }

      try {
        const dateien = [
          "Lernfelder.json",
          "Themen.json",
          "Cores.json",
          "Core-Ausprägungen.json",
          "Quellen.json"
        ];
        const cacheMarker = Date.now();
        const daten = Object.fromEntries(await Promise.all(dateien.map(async datei => {
          const antwort = await fetch(`${datei}?stand=${cacheMarker}`, { cache: "no-store" });
          if (!antwort.ok) throw new Error(`${datei}: HTTP ${antwort.status}`);
          return [datei, await antwort.json()];
        })));

        const lernfelder = daten["Lernfelder.json"].lernfelder ?? [];
        const kompetenzen = lernfelder.flatMap(lernfeld => lernfeld.kompetenzen ?? []);
        const themencluster = daten["Themen.json"].themencluster ?? [];
        const themen = daten["Themen.json"].themen ?? [];
        const kategorien = daten["Cores.json"].categories ?? [];
        const cores = daten["Cores.json"].cores ?? [];
        const ausprägungen = daten["Core-Ausprägungen.json"].core_ausprägungen ?? [];
        const quellen = daten["Quellen.json"].quellen ?? [];

        const spezifikationen = [
          { id: "kategorie", titel: "Kategorie", datei: "Cores.json", items: kategorien, spalte: "1", zeile: "1" },
          { id: "core", titel: "Core", datei: "Cores.json", items: cores, spalte: "2", zeile: "1" },
          { id: "quelle", titel: "Quelle", datei: "Quellen.json", items: quellen, spalte: "4", zeile: "1" },
          { id: "thema", titel: "Thema", datei: "Themen.json", items: themen, spalte: "1", zeile: "2" },
          { id: "themencluster", titel: "Themencluster", datei: "Themen.json", items: themencluster, spalte: "2", zeile: "2" },
          { id: "kompetenz", titel: "Kompetenz", datei: "Lernfelder.json", items: kompetenzen, spalte: "3", zeile: "2" },
          { id: "lernfeld", titel: "Lernfeld", datei: "Lernfelder.json", items: lernfelder, spalte: "4", zeile: "2" },
          { id: "ausprägung", titel: "Core-Ausprägung", datei: "Core-Ausprägungen.json", items: ausprägungen, spalte: "2 / span 2", zeile: "3" }
        ];
        spezifikationen.forEach(entitätRendern);

        const mengen = {
          lernfeld: new Set(lernfelder.map(item => item.id)),
          kompetenz: new Set(kompetenzen.map(item => item.id)),
          themencluster: new Set(themencluster.map(item => item.id)),
          thema: new Set(themen.map(item => item.id)),
          core: new Set(cores.map(item => item.id)),
          quelle: new Set(quellen.map(item => item.id)),
          kategorie: new Set(kategorien.map(item => item.id))
        };
        const beziehungen = [];

        function bezug(von, vonTitel, zu, zuTitel, items, feld) {
          const prüfung = referenzenPrüfen(mengen[von], items, feld);
          beziehungen.push({ von, vonTitel, zu, zuTitel, feld, ...prüfung });
        }

        bezug("lernfeld", "Lernfeld", "kompetenz", "Kompetenz", kompetenzen, "lernfeld_ref");
        bezug("kompetenz", "Kompetenz", "themencluster", "Themencluster", themencluster, "kompetenz_ref");
        bezug("themencluster", "Themencluster", "thema", "Thema", themen, "themencluster_ref");
        bezug("core", "Core", "ausprägung", "Core-Ausprägung", ausprägungen, "core_ref");
        bezug("lernfeld", "Lernfeld", "ausprägung", "Core-Ausprägung", ausprägungen, "lernfeld_ref");
        bezug("kompetenz", "Kompetenz", "ausprägung", "Core-Ausprägung", ausprägungen, "kompetenz_ref");
        bezug("themencluster", "Themencluster", "ausprägung", "Core-Ausprägung", ausprägungen, "themencluster_ref");
        bezug("thema", "Thema", "ausprägung", "Core-Ausprägung", ausprägungen, "thema_ref");
        bezug("quelle", "Quelle", "lernfeld", "Lernfeld", lernfelder, "official_source_ref");

        const kategorieBezüge = cores.flatMap(core =>
          Object.keys(core.category_weights ?? {}).map(kategorieId => kategorieId)
        );
        beziehungen.push({
          von: "kategorie",
          vonTitel: "Kategorie",
          zu: "core",
          zuTitel: "Core",
          feld: "category_weights",
          anzahl: kategorieBezüge.length,
          ungültig: kategorieBezüge.filter(id => !mengen.kategorie.has(id)).length
        });

        const coreQuellen = cores.flatMap(core => core.evidence_source_refs ?? []);
        beziehungen.push({
          von: "quelle",
          vonTitel: "Quelle",
          zu: "core",
          zuTitel: "Core",
          feld: "evidence_source_refs",
          anzahl: coreQuellen.length,
          ungültig: coreQuellen.filter(id => !mengen.quelle.has(id)).length
        });

        const ausprägungsQuellen = ausprägungen.flatMap(ausprägung =>
          (ausprägung.source_refs ?? []).map(bezug => bezug.source_id)
        );
        beziehungen.push({
          von: "quelle",
          vonTitel: "Quelle",
          zu: "ausprägung",
          zuTitel: "Core-Ausprägung",
          feld: "source_refs[].source_id",
          anzahl: ausprägungsQuellen.length,
          ungültig: ausprägungsQuellen.filter(id => !mengen.quelle.has(id)).length
        });

        beziehungenRendern(beziehungen);
        const schemaVersionen = [...new Set(dateien.map(datei => daten[datei].schema_version))];
        const ungültig = beziehungen.reduce((summe, beziehung) => summe + beziehung.ungültig, 0);
        status.textContent =
          `Schema ${schemaVersionen.join(" / ")} · ` +
          `${lernfelder.length} Lernfeld · ${kompetenzen.length} Kompetenzen · ` +
          `${themencluster.length} Themencluster · ${themen.length} Themen · ` +
          `${cores.length} Cores · ${ausprägungen.length} Core-Ausprägungen · ` +
          `${quellen.length} Quellen · ${ungültig} nicht auflösbare Referenzen`;
        status.dataset.zustand = ungültig ? "fehler" : "bereit";

        forceLayoutStarten(beziehungen);
      } catch (fehler) {
        status.dataset.zustand = "fehler";
        status.textContent = `ERD konnte nicht aus den aktuellen JSON-Dateien erzeugt werden: ${fehler.message}`;
      }
    })();
  </script>
</body>
</html>
