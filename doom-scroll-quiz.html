<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=10, user-scalable=yes">
  <title>Doom Scroll Quiz · Thors Core</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d1b;
      --panel: #111b2b;
      --panel2: #16253b;
      --line: #3a5574;
      --text: #f6f7fb;
      --muted: #b7c4d8;
      --cyan: #46d7ff;
      --purple: #7e35d8;
      --green: #4dd487;
      --top-app-bar-höhe: calc(52px + env(safe-area-inset-top, 0px));
      --app-bar-höhe: calc(62px + env(safe-area-inset-bottom, 0px));
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      touch-action: pan-x pan-y pinch-zoom;
      background:
        radial-gradient(circle at 18% 8%, #241a3c 0, transparent 34rem),
        radial-gradient(circle at 86% 16%, #0f4450 0, transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .top-app-bar {
      position: fixed;
      z-index: 100;
      inset: 0 0 auto;
      display: grid;
      place-items: center;
      width: 100vw;
      min-height: var(--top-app-bar-höhe);
      padding: calc(8px + env(safe-area-inset-top, 0px))
        max(12px, env(safe-area-inset-right, 0px))
        8px
        max(12px, env(safe-area-inset-left, 0px));
      border-bottom: 1px solid rgba(183, 195, 220, 0.2);
      color: #eef2f9;
      background: rgba(10, 14, 23, 0.96);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
      touch-action: pan-x pan-y pinch-zoom;
    }

    .top-app-bar__text {
      margin: 0;
      font-size: clamp(0.78rem, 2.4vw, 0.92rem);
      font-weight: 850;
      line-height: 1.25;
      text-align: center;
    }

    .quiz-app {
      width: 100%;
      min-width: 0;
      height: calc(100vh - var(--top-app-bar-höhe) - var(--app-bar-höhe));
      height: calc(100dvh - var(--top-app-bar-höhe) - var(--app-bar-höhe));
      margin-top: var(--top-app-bar-höhe);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 14px 24px 12px;
      overflow: hidden;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .quiz-kopf {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, auto);
      align-items: center;
      gap: 16px;
    }

    .pool-chip {
      min-width: 0;
      color: var(--cyan);
      font-size: 0.75rem;
      font-weight: 1000;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .feed {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 28px;
      touch-action: pan-y pinch-zoom;
      cursor: grab;
    }

    .feed.zieht {
      cursor: grabbing;
    }

    .karten-spur {
      display: flex;
      width: 100%;
      min-width: 0;
      height: 100%;
      will-change: transform;
      transition: transform 320ms cubic-bezier(0.22, 0.72, 0.18, 1);
    }

    .feed.zieht .karten-spur {
      transition: none;
    }

    .quiz-karte {
      width: 100%;
      min-width: 0;
      height: 100%;
      flex: 0 0 100%;
      display: grid;
      place-items: center;
      padding: 28px 8vw;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .quiz-karte::-webkit-scrollbar {
      display: none;
    }

    .aufgabe {
      width: min(1080px, 100%);
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .tag {
      width: fit-content;
      max-width: 100%;
      overflow-wrap: anywhere;
      color: var(--cyan);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 1000;
      font-size: clamp(12px, 1vw, 16px);
    }

    h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(28px, 4vw, 56px);
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .hinweis {
      max-width: 840px;
      margin: -3px 0 4px;
      color: var(--muted);
      font-size: clamp(17px, 1.5vw, 24px);
      font-weight: 750;
      line-height: 1.45;
    }

    .antworten {
      display: grid;
      gap: 12px;
    }

    .antwort {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 18px;
      min-height: 72px;
      min-width: 0;
      padding: 14px 18px;
      border: 1.5px solid rgba(118, 157, 205, 0.52);
      border-radius: 20px;
      color: var(--text);
      background: rgba(24, 40, 64, 0.82);
      text-align: left;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .antwort:hover,
    .antwort:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(100, 209, 255, 0.78);
      outline: none;
    }

    .antwort.ausgewählt {
      border-color: #b996ff;
      background: rgba(88, 45, 135, 0.34);
    }

    .antwort.richtig,
    .zuordnungszeile.richtig,
    .lücke.richtig,
    .sortierzeile.richtig,
    .lückentext-satz select.richtig {
      border-color: var(--green);
      background: rgba(39, 132, 83, 0.28);
    }

    .antwort.falsch,
    .zuordnungszeile.falsch,
    .lücke.falsch,
    .sortierzeile.falsch,
    .lückentext-satz select.falsch {
      border-color: #ff6f7d;
      background: rgba(153, 37, 58, 0.3);
    }

    .marke {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 3px solid #9db0c8;
      border-radius: 50%;
    }

    .ausgewählt .marke {
      border-color: #dcb8ff;
      background: #541b8d;
      box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.92);
    }

    .antwort-text {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: clamp(20px, 1.7vw, 31px);
      font-weight: 900;
    }

    .leerstand {
      min-height: 24px;
      color: #d9c8f3;
      font-weight: 760;
      line-height: 1.45;
    }

    .leerstand.erfolg { color: #7bf0aa; }
    .leerstand.fehler { color: #ff9ca6; }

    .quelle {
      min-width: 0;
      color: #91a4bd;
      font-size: 0.82rem;
      font-weight: 720;
    }

    .sortierliste,
    .eingabe-muster,
    .zuordnungsliste,
    .lückentext {
      display: grid;
      gap: 12px;
    }

    .zuordnungszeile,
    .lücke {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr);
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 10px 14px;
      border: 1.5px solid rgba(118, 157, 205, 0.52);
      border-radius: 18px;
      background: rgba(24, 40, 64, 0.82);
    }

    .zuordnungszeile strong,
    .lücke strong {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .zuordnungszeile select,
    .lücke select,
    .lückentext-satz select {
      min-height: 46px;
      padding: 6px 38px 6px 12px;
      border: 1px solid rgba(180, 205, 239, 0.46);
      border-radius: 12px;
      color: var(--text);
      background: #13223a;
      font: inherit;
      font-weight: 780;
    }

    .zuordnungszeile select,
    .lücke select {
      width: 100%;
      min-width: 0;
    }

    .lückentext-satz {
      color: var(--text);
      font-size: clamp(18px, 1.7vw, 26px);
      font-weight: 780;
      line-height: 1.8;
    }

    .lückentext-satz select {
      width: auto;
      min-width: 150px;
      margin: 0 6px;
    }

    .sortierzeile {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 10px 14px;
      border: 1.5px solid rgba(118, 157, 205, 0.52);
      border-radius: 18px;
      background: rgba(24, 40, 64, 0.82);
    }

    .griff {
      color: var(--cyan);
      font-size: 22px;
      letter-spacing: -0.2em;
    }

    .sortierzeile button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(180, 205, 239, 0.38);
      border-radius: 50%;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .eingabe-muster label {
      color: var(--muted);
      font-weight: 800;
    }

    .eingabe-muster input[type="text"] {
      width: 100%;
      min-height: 62px;
      padding: 0 18px;
      border: 1.5px solid rgba(118, 157, 205, 0.52);
      border-radius: 18px;
      color: var(--text);
      background: rgba(24, 40, 64, 0.82);
      font: inherit;
      font-size: 18px;
    }

    .eingabe-muster input[type="range"] {
      width: 100%;
      accent-color: #9c5be8;
    }

    .quiz-fuß {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
    }

    .steuerung {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .nav,
    .prüfen {
      height: 52px;
      border-radius: 999px;
      color: white;
      font-weight: 1000;
      cursor: pointer;
    }

    .nav:focus-visible,
    .prüfen:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
    }

    .nav:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .nav {
      width: 52px;
      border: 1.5px solid rgba(180, 205, 239, 0.46);
      background: rgba(255, 255, 255, 0.06);
      font-size: 26px;
    }

    .prüfen {
      min-width: 240px;
      padding: 0 24px;
      border: 1.5px solid #ad79f5;
      background: linear-gradient(135deg, #8038db, #51137f);
      font-size: 18px;
    }

    .fortschritt {
      justify-self: end;
      color: var(--muted);
      font-weight: 900;
    }

    .punktestand {
      color: var(--muted);
      font-weight: 900;
    }

    @media (max-width: 720px) {
      .quiz-app { padding: 10px 12px; }
      .pool-chip { font-size: 0.68rem; }
      .quiz-karte { padding: 22px 10px; }
      .quiz-fuß { grid-template-columns: 1fr; }
      .fortschritt,
      .punktestand { justify-self: center; }
      .prüfen { min-width: 190px; }
      .quiz-kopf { grid-template-columns: 1fr; }
      .zuordnungszeile,
      .lücke { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .karten-spur {
        transition: none;
      }
    }
  </style>
