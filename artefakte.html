<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=10, user-scalable=yes">
  <title>Artefakte · Thors Core</title>
  <style>
    :root {
      color-scheme: dark;
      --hintergrund: #090d1b;
      --text: #f6f7fb;
      --linie: rgba(183, 195, 220, 0.2);
      --cyan: #46d7ff;
      --flamme: #ff9f43;
      --top-app-bar-höhe: calc(52px + env(safe-area-inset-top, 0px));
      --seiten-navigation-höhe: 60px;
      --app-bar-höhe: calc(62px + env(safe-area-inset-bottom, 0px));
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background: var(--hintergrund);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .top-app-bar {
      position: fixed;
      z-index: 100;
      inset: 0 0 auto;
      display: grid;
      place-items: center;
      width: 100vw;
      min-height: var(--top-app-bar-höhe);
      padding: calc(8px + env(safe-area-inset-top, 0px))
        max(12px, env(safe-area-inset-right, 0px))
        8px
        max(12px, env(safe-area-inset-left, 0px));
      border-bottom: 1px solid rgba(183, 195, 220, 0.2);
      color: #eef2f9;
      background: rgba(10, 14, 23, 0.96);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
      touch-action: pan-x pan-y pinch-zoom;
    }

    .top-app-bar__text {
      margin: 0;
      font-size: clamp(0.78rem, 2.4vw, 0.92rem);
      font-weight: 850;
      line-height: 1.25;
      text-align: center;
    }

    .zurück {
      position: fixed;
      z-index: 2;
      top: calc(var(--top-app-bar-höhe) + 8px);
      left: max(16px, env(safe-area-inset-left));
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(180, 205, 239, 0.34);
      border-radius: 999px;
      color: rgba(246, 247, 251, 0.92);
      background: rgba(10, 14, 23, 0.88);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
      font-weight: 850;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .zurück:hover,
    .zurück:focus-visible {
      border-color: rgba(70, 215, 255, 0.7);
      outline: none;
    }

    .fachrichtungsstatus {
      position: fixed;
      z-index: 2;
      top: calc(var(--top-app-bar-höhe) + 8px);
      right: max(16px, env(safe-area-inset-right, 0px));
      min-height: 44px;
      margin: 0;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(70, 215, 255, 0.32);
      border-radius: 999px;
      color: rgba(226, 242, 250, 0.88);
      background: rgba(10, 14, 23, 0.88);
      font-size: 0.75rem;
      font-weight: 800;
      backdrop-filter: blur(12px);
    }

    .artefakte-raster {
      width: 100%;
      height: calc(100vh - var(--top-app-bar-höhe) - var(--seiten-navigation-höhe) - var(--app-bar-höhe));
      height: calc(100dvh - var(--top-app-bar-höhe) - var(--seiten-navigation-höhe) - var(--app-bar-höhe));
      margin-top: calc(var(--top-app-bar-höhe) + var(--seiten-navigation-höhe));
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      overflow: hidden;
    }

    .artefakt-bereich {
      min-width: 0;
      min-height: 0;
      padding: 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      place-items: stretch;
      overflow: hidden;
      border: 0 solid var(--linie);
      border-right-width: 1px;
      border-bottom-width: 1px;
      background:
        radial-gradient(circle at 50% 20%, rgba(70, 215, 255, 0.08), transparent 58%),
        rgba(17, 27, 43, 0.78);
    }

    .artefakt-bereich:nth-child(2),
    .artefakt-bereich:nth-child(5) {
      background:
        radial-gradient(circle at 50% 20%, rgba(156, 102, 239, 0.11), transparent 58%),
        rgba(20, 25, 43, 0.82);
    }

    .artefakt-bereich:nth-child(3),
    .artefakt-bereich:nth-child(4) {
      background:
        radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.11), transparent 58%),
        rgba(14, 25, 43, 0.82);
    }

    .artefakt-titel {
      margin: 0;
      padding: 12px 14px 11px;
      border: 1px solid rgba(183, 195, 220, 0.16);
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      color: rgba(248, 250, 255, 0.96);
      background: rgba(7, 12, 25, 0.58);
      font-size: clamp(1rem, 2vw, 1.45rem);
      font-weight: 850;
      line-height: 1.2;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .artefakt-bereich--geteilt {
      padding: 10px;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr));
      place-items: stretch;
    }

    .artefakt-unterbereich {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border-radius: 14px;
    }

    .artefakt-unterbereich + .artefakt-unterbereich {
      background: rgba(156, 102, 239, 0.06);
    }

    .artefakt-baum {
      min-height: 0;
      padding: 8px 10px 14px;
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 1px solid rgba(183, 195, 220, 0.16);
      border-radius: 0 0 14px 14px;
      background: rgba(5, 10, 21, 0.38);
      scrollbar-width: thin;
      scrollbar-color: rgba(126, 53, 216, 0.72) transparent;
    }

    .artefakt-baum ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .artefakt-baum li {
      min-height: 34px;
      border-radius: 9px;
      color: rgba(232, 237, 247, 0.86);
      font-size: 0.74rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
      transition: color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    .artefakt-baum li:nth-child(even) {
      background: rgba(255, 255, 255, 0.025);
    }

    .artefakt-baum li:hover {
      color: #fff;
      background: rgba(70, 215, 255, 0.08);
      transform: translateX(2px);
    }

    .artefakt-eintrag__link {
      min-height: 34px;
      padding: 7px 9px;
      display: grid;
      grid-template-columns: 1.35rem minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      color: inherit;
      text-decoration: none;
    }

    .artefakt-eintrag__link:focus-visible {
      border-radius: 9px;
      outline: 2px solid rgba(70, 215, 255, 0.82);
      outline-offset: -2px;
    }

    .artefakt-eintrag__symbol {
      display: grid;
      place-items: center;
      width: 1.35rem;
      height: 1.35rem;
      color: rgba(70, 215, 255, 0.7);
      font-size: 0.72rem;
      line-height: 1;
    }

    .artefakt-eintrag__symbol::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .artefakt-eintrag--prüfungsrelevant .artefakt-eintrag__symbol {
      color: var(--flamme);
      font-size: 1rem;
      filter: drop-shadow(0 0 6px rgba(255, 159, 67, 0.38));
    }

    .artefakt-eintrag--prüfungsrelevant .artefakt-eintrag__symbol::before {
      content: "🔥";
      width: auto;
      height: auto;
      background: none;
    }

    @media (max-width: 700px) {
      .artefakte-raster {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
      }

      .artefakt-bereich {
        padding: 6px;
      }

      .artefakt-bereich--geteilt {
        padding: 6px;
        gap: 6px;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }

      .artefakt-unterbereich {
        padding: 0;
      }

      .artefakt-unterbereich + .artefakt-unterbereich {
        border-left: 0;
      }

      .artefakt-titel {
        padding: 10px 8px;
        font-size: clamp(0.8rem, 3.8vw, 1.1rem);
      }

      .artefakt-baum {
        padding: 5px 6px 10px;
      }

      .artefakt-baum li {
        min-height: 30px;
        padding: 5px 6px;
        grid-template-columns: 1.15rem minmax(0, 1fr);
        gap: 5px;
        font-size: 0.64rem;
      }

      .artefakt-eintrag__symbol {
        width: 1.15rem;
        height: 1.15rem;
      }
    }
  </style>

      const FACHRICHTUNG_SCHLÜSSEL = "thors-core.fachrichtung.v1";
      const FACHRICHTUNGSNAMEN = {
        "anwendungsentwicklung": "Anwendungsentwicklung",
        "systemintegration": "Systemintegration",
        "daten-prozessanalyse": "Daten- und Prozessanalyse",
        "digitale-vernetzung": "Digitale Vernetzung"
      };
      // Der reale Vorlagenbestand nutzt FIAE/FISI/FIDP/FIDV. 4E und 4SI
      // bleiben als ausdrücklich geforderte Alias-Kürzel zusätzlich lesbar.
      const FACHRICHTUNGS_KENNUNGEN = {
        "anwendungsentwicklung": ["FIAE", "4E"],
        "systemintegration": ["FISI", "4SI"],
        "daten-prozessanalyse": ["FIDP"],
        "digitale-vernetzung": ["FIDV"]
      };
      const DOKUMENTFORMEN = {
        "bpmn": "BPMN-Prozessmodell",
        "css": "Stylesheet",
        "csv": "CSV-Datei",
        "docx": "Textdokument",
        "drawio": "Diagrammdatei",
        "html": "HTML-Dokument",
        "ini": "Konfigurationsdatei",
        "json": "JSON-Datei",
        "md": "Markdown-Dokument",
        "puml": "PlantUML-Diagramm",
        "py": "Python-Datei",
        "sql": "SQL-Datei",
        "txt": "Textdatei",
        "xlsx": "Arbeitsmappe"
      };
      let gewählteFachrichtung = "";

      try {
        const gespeichert = localStorage.getItem(FACHRICHTUNG_SCHLÜSSEL);
        if (gespeichert in FACHRICHTUNGSNAMEN) {
          gewählteFachrichtung = gespeichert;
        }
      } catch {
        gewählteFachrichtung = "";
      }

      document.body.dataset.fachrichtung = gewählteFachrichtung || "nicht-ausgewählt";
      document.querySelector("#fachrichtungsstatus").textContent = gewählteFachrichtung
        ? `Fachrichtung: ${FACHRICHTUNGSNAMEN[gewählteFachrichtung]}`
        : "Fachrichtung: nicht ausgewählt";

      document.querySelectorAll("[data-baum]").forEach(container => {
        const ordner = baumDaten[container.dataset.baum];
        const liste = document.createElement("ul");
        const dateien = Object.entries(ordner)
          .flatMap(([relevanz, einträge]) => einträge.map(dateiname => ({
            dateiname,
            prüfungsrelevant: relevanz === "Prüfungsrelevante"
          })))
          .sort((links, rechts) => zweckAusDateiname(links.dateiname)
            .localeCompare(zweckAusDateiname(rechts.dateiname), "de"));

        dateien
          .filter(({ dateiname }) => dateiPasstZurFachrichtung(dateiname))
          .forEach(({ dateiname, prüfungsrelevant }) => {
          const eintrag = document.createElement("li");
          const link = document.createElement("a");
          const symbol = document.createElement("span");
          const name = document.createElement("span");
          eintrag.className = "artefakt-eintrag";
          eintrag.dataset.prüfungsrelevant = String(prüfungsrelevant);
          eintrag.dataset.fachrichtungen = dateiFachrichtungen(dateiname).join(",");
          if (prüfungsrelevant) {
            eintrag.classList.add("artefakt-eintrag--prüfungsrelevant");
            symbol.setAttribute("role", "img");
            symbol.setAttribute("aria-label", "Prüfungsrelevant");
          } else {
            symbol.setAttribute("aria-hidden", "true");
          }
          symbol.className = "artefakt-eintrag__symbol";
          link.className = "artefakt-eintrag__link";
          name.className = "artefakt-eintrag__name";
          name.textContent = sichtbarerName(dateiname);
          link.href = detailUrl(dateiname, container.dataset.baum, prüfungsrelevant);
          link.setAttribute("aria-label", `${sichtbarerName(dateiname)} ansehen`);
          link.append(symbol, name);
          eintrag.append(link);
          liste.append(eintrag);
        });
        container.append(liste);
      });

      function detailUrl(dateiname, bereich, prüfungsrelevant) {
        const parameter = new URLSearchParams({
          datei: dateiname,
          bereich,
          relevant: String(prüfungsrelevant)
        });
        return `artefakt-ansicht.html?${parameter}`;
      }

      function sichtbarerName(dateiname) {
        const endung = dateiname.match(/\.([^.]+)$/)?.[1].toLowerCase() || "";
        const form = DOKUMENTFORMEN[endung] || "Datei";
        return `${form} · ${zweckAusDateiname(dateiname)}`;
      }

      function zweckAusDateiname(dateiname) {
        const rohTitel = dateiname
          .replace(/^_+/, "")
          .replace(/\.[^.]+$/, "")
          .replace(/_/g, " ");
        return dokumentzweck(rohTitel);
      }

      function dokumentzweck(rohTitel) {
        const testfall = rohTitel.match(/^Testfall (.+)$/i);
        if (testfall) {
          return `Testfallbeschreibung – ${testfall[1]}`;
        }
        if (/^FIAE test /i.test(rohTitel)) {
          return rohTitel.replace(/^FIAE test /i, "FIAE Test – ");
        }
        if (/^beispiel import$/i.test(rohTitel)) {
          return "Beispieldaten für den Import";
        }
        if (/^beispiel export$/i.test(rohTitel)) {
          return "Beispieldaten für den Export";
        }
        if (/^demo daten$/i.test(rohTitel)) {
          return "Demodaten";
        }
        if (/^pytest$/i.test(rohTitel)) {
          return "Pytest-Konfiguration";
        }
        return rohTitel;
      }

      function dateiFachrichtungen(dateiname) {
        const kennungen = dateiname.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
        return Object.entries(FACHRICHTUNGS_KENNUNGEN)
          .filter(([, kürzel]) => kürzel.some(eintrag => kennungen.includes(eintrag)))
          .map(([fachrichtung]) => fachrichtung);
      }

      function dateiPasstZurFachrichtung(dateiname) {
        const fachrichtungen = dateiFachrichtungen(dateiname);
        return fachrichtungen.length === 0
          || (gewählteFachrichtung && fachrichtungen.includes(gewählteFachrichtung));
      }
    })();
  </script>
