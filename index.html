<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=10, user-scalable=yes">
  <meta name="description" content="Didaktische Navigation für Lernfeld 1">
  <title>TheRealDeal · Lernfeld 1</title>
  <style>
    :root {
      color-scheme: dark;
      --hintergrund: #070a11;
      --fläche: rgba(13, 18, 29, 0.9);
      --text: #eef2f9;
      --gedimmt: #8995aa;
      --linie: rgba(183, 195, 220, 0.12);
      --blau: #2563eb;
      --gelb: #facc15;
      --rot: #dc2626;
      --app-bar-höhe: calc(70px + env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 9% 10%, rgba(37, 99, 235, 0.1), transparent 35rem),
        radial-gradient(circle at 88% 12%, rgba(250, 204, 21, 0.06), transparent 40rem),
        radial-gradient(circle at 58% 92%, rgba(220, 38, 38, 0.07), transparent 38rem),
        var(--hintergrund);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(370px, 440px) 1fr;
      width: 100%;
      height: calc(100% - var(--app-bar-höhe));
    }

    .navigation {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: clamp(16px, 2vw, 24px) 18px 18px;
      border-right: 1px solid var(--linie);
      overflow: hidden;
      scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      background:
        linear-gradient(180deg, rgba(19, 25, 39, 0.76), rgba(9, 13, 22, 0.92)),
        var(--fläche);
      box-shadow: 18px 0 54px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(18px);
      touch-action: pan-x pan-y pinch-zoom;
    }

    .navigation.quiz-übergang-aktiv {
      will-change: transform, width, height, opacity;
    }

    .ordnerbaum {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    details {
      margin: 0;
    }

    summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: #cdd5e3;
      font-size: 0.8rem;
      font-weight: 650;
      line-height: 1.3;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker { display: none; }

    .baum-checkbox {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 14px;
      height: 11px;
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 72%, white);
      border-radius: 3px;
      background: color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 17%, transparent);
      box-shadow: 0 0 13px color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 15%, transparent);
      cursor: pointer;
    }

    .baum-checkbox::after {
      content: "✓";
      color: #f8fafc;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 100ms ease, transform 100ms ease;
    }

    .baum-checkbox:checked {
      border-color: color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 86%, white);
      background: color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 58%, #111827);
    }

    .baum-checkbox:checked::after {
      opacity: 1;
      transform: scale(1);
    }

    .baum-checkbox:indeterminate {
      border-color: color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 86%, white);
      background: color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 38%, #111827);
    }

    .baum-checkbox:indeterminate::after {
      content: "−";
      opacity: 1;
      transform: scale(1);
    }

    .baum-checkbox:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 65%, white);
      outline-offset: 2px;
    }

    .baum-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.46;
    }

    summary::after {
      content: "›";
      margin-left: auto;
      color: var(--gedimmt);
      font-size: 1rem;
      line-height: 1;
      transform: rotate(0);
      transition: transform 150ms ease;
    }

    details[open] > summary::after {
      transform: rotate(90deg);
    }

    summary:hover,
    summary:focus-visible,
    .thema:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.035);
      outline: none;
    }

    .lernfeld > details > summary {
      min-height: 49px;
      padding: 10px 12px;
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.96rem;
      font-weight: 750;
      --ordnerfarbe: #82a6ff;
    }

    .ebene {
      position: relative;
      margin: 5px 0 0 18px;
      padding: 3px 0 3px 18px;
    }

    .ebene::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 14px;
      width: 1px;
      background: linear-gradient(var(--linie), rgba(183, 195, 220, 0.025));
    }

    .ebene > li {
      position: relative;
      margin: 2px 0;
    }

    .ebene > li::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 21px;
      width: 12px;
      height: 1px;
      background: var(--linie);
    }

    .kompetenz > details > summary {
      --ordnerfarbe: var(--blau);
      font-size: 0.81rem;
      font-weight: 700;
    }

    .kompetenz:nth-child(3n + 2) > details > summary {
      --ordnerfarbe: var(--gelb);
    }

    .kompetenz:nth-child(3n) > details > summary {
      --ordnerfarbe: var(--rot);
    }

    .cluster > details > summary {
      --ordnerfarbe: #9d8bd8;
      color: #b9c2d2;
      font-size: 0.76rem;
      font-weight: 630;
    }

    .thema {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 7px 9px;
      border-radius: 10px;
      color: #98a4b8;
      font-size: 0.72rem;
      line-height: 1.3;
      --ordnerfarbe: #64748b;
    }

    .thema .baum-checkbox {
      width: 11px;
      height: 9px;
      box-shadow: none;
    }

    .thema-fokus {
      min-width: 0;
      padding: 3px 4px;
      border: 0;
      border-radius: 6px;
      color: inherit;
      background: transparent;
      font: inherit;
      line-height: inherit;
      text-align: left;
      cursor: pointer;
    }

    .thema-fokus:hover,
    .thema-fokus:focus-visible {
      color: #eef2f9;
      background: rgba(255, 255, 255, 0.045);
      outline: none;
    }

    .thema-fokus[aria-pressed="true"] {
      color: #ffffff;
      background: rgba(130, 166, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(130, 166, 255, 0.22);
    }

    .entdeckungsleiste {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      gap: 7px;
      padding: 14px 2px 0;
      border-top: 1px solid var(--linie);
    }

    .entdeckungsaktion {
      padding: 7px 9px;
      border: 1px solid rgba(183, 195, 220, 0.14);
      border-radius: 7px;
      color: #aeb8ca;
      background: rgba(255, 255, 255, 0.025);
      font: inherit;
      font-size: 0.67rem;
      cursor: pointer;
    }

    .entdeckungsaktion:hover,
    .entdeckungsaktion:focus-visible {
      color: #eef2f9;
      border-color: rgba(130, 166, 255, 0.32);
      background: rgba(130, 166, 255, 0.08);
      outline: none;
    }

    .entdeckungsaktion[aria-pressed="true"] {
      color: #eef2f9;
      border-color: rgba(130, 166, 255, 0.46);
      background: rgba(130, 166, 255, 0.13);
    }

    .quiz-auswahlhinweis {
      flex: 0 0 auto;
      margin: 0 2px 12px;
      padding: 11px 13px;
      border: 1px solid rgba(130, 166, 255, 0.32);
      border-radius: 10px;
      color: #eef2f9;
      background: rgba(130, 166, 255, 0.1);
      font-size: 0.76rem;
      font-weight: 800;
      line-height: 1.4;
    }

    .quiz-auswahlaktionen {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 12px 2px;
      border-top: 1px solid var(--linie);
    }

    .quiz-auswahlhinweis[hidden],
    .quiz-auswahlaktionen[hidden] {
      display: none;
    }

    .quiz-auswahlaktionen button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid rgba(183, 195, 220, 0.2);
      border-radius: 8px;
      color: #dce4f1;
      background: rgba(255, 255, 255, 0.04);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
    }

    .quiz-auswahlaktionen button:hover,
    .quiz-auswahlaktionen button:focus-visible {
      border-color: rgba(130, 166, 255, 0.48);
      background: rgba(130, 166, 255, 0.12);
      outline: none;
    }

    .quiz-auswahlaktionen button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .app.quiz-auswahlmodus {
      grid-template-columns: 1fr;
    }

    .app.quiz-auswahlmodus .navigation {
      position: fixed;
      top: clamp(14px, 3vh, 32px);
      bottom: clamp(14px, 3vh, 32px);
      left: 50%;
      z-index: 30;
      width: min(520px, calc(100vw - 28px));
      height: auto;
      max-height: none;
      padding: 18px;
      border: 1px solid rgba(130, 166, 255, 0.3);
      border-radius: 18px;
      transform: translateX(-50%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
    }

    .app.quiz-auswahlmodus .arbeitsfläche {
      grid-column: 1;
    }

    .app.quiz-auswahlmodus .thema {
      background: rgba(130, 166, 255, 0.035);
    }

    .app.quiz-auswahlmodus .baum-checkbox:not(:disabled) {
      width: 15px;
      height: 13px;
      opacity: 1;
      border-color: color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 86%, white);
      background: color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 28%, transparent);
      box-shadow:
        0 0 0 2px rgba(130, 166, 255, 0.12),
        0 0 16px color-mix(in srgb, var(--ordnerfarbe, #8ca4d5) 34%, transparent);
    }

    .app.quiz-auswahlmodus .baum-checkbox:disabled {
      opacity: 0.2;
    }

    .app.navigation-geschlossen {
      grid-template-columns: 1fr;
    }

    .app.navigation-geschlossen .navigation {
      display: none;
    }

    .app.navigation-geschlossen .arbeitsfläche {
      grid-column: 1;
    }

    .app.settings-offen {
      grid-template-columns:
        minmax(370px, 440px)
        minmax(0, 1fr)
        minmax(260px, 320px);
    }

    .app.navigation-geschlossen.settings-offen {
      grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
    }

    .app.navigation-geschlossen.settings-offen .settings-drawer {
      grid-column: 2;
    }

    .arbeitsfläche {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .core-inhalt {
      width: 100%;
      height: 100%;
    }

    .vault-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: pinch-zoom;
    }

    .vault-viewport.zieht {
      cursor: grabbing;
    }

    .core-raster {
      position: absolute;
      left: 0;
      top: 0;
      width: 2600px;
      height: 2000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    .themen-linien {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .themen-linie {
      fill: none;
      stroke: rgba(238, 242, 249, 0.26);
      stroke-width: 1;
      opacity: 0.56;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .themen-linien.fokus-aktiv .themen-linie-basis {
      opacity: 0.08;
    }

    .themen-linie-fokus {
      stroke: rgba(255, 255, 255, 0.68);
      stroke-width: 2.8;
      opacity: 1;
    }

    .core-karte {
      position: absolute;
      z-index: 1;
      width: var(--core-größe, 88px);
      height: var(--core-größe, 88px);
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: help;
      transform: translate(-50%, -50%);
      isolation: isolate;
      --aktive-core-farbe: var(--prototyp-kategoriefarbe, var(--core-farbe));
      transition: transform 140ms ease, opacity 180ms ease;
    }

    .core-karte.abgeblendet {
      opacity: 0.13;
      filter: saturate(0.25);
    }

    .core-karte.hervorgehoben {
      z-index: 8;
      opacity: 1;
      filter: saturate(1.15) brightness(1.08);
    }

    .core-karte::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -48%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--aktive-core-farbe) 72%, transparent) 0%,
        color-mix(in srgb, var(--aktive-core-farbe) 32%, transparent) 42%,
        transparent 72%
      );
      opacity: 0.94;
      pointer-events: none;
    }

    .core-karte::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: 50%;
      background: #05070b;
      pointer-events: none;
    }

    .core-raster.fortschritt-prototyp .core-karte {
      --aktive-core-farbe: var(--prototyp-kategoriefarbe);
    }

    .core-fortschrittsring {
      position: absolute;
      z-index: 2;
      inset: -0.5px;
      border-radius: 50%;
      background: conic-gradient(
        from -90deg,
        var(--prototyp-kategoriefarbe) 0deg var(--core-fortschrittswinkel),
        transparent var(--core-fortschrittswinkel) 360deg
      );
      -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 1px),
        #000 calc(100% - 1px)
      );
      mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 1px),
        #000 calc(100% - 1px)
      );
      opacity: 0;
      pointer-events: none;
    }

    .core-raster.fortschritt-prototyp .core-fortschrittsring {
      opacity: var(--core-fortschrittsring-sichtbar, 1);
    }

    .fortschrittslegende {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 5;
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 9px 10px;
      border: 1px solid rgba(183, 195, 220, 0.14);
      border-radius: 8px;
      color: #c7cfdd;
      background: rgba(5, 7, 11, 0.88);
      font-size: 0.68rem;
      line-height: 1.15;
      list-style: none;
      pointer-events: auto;
    }

    .fortschrittslegende[hidden] {
      display: none;
    }

    .fortschrittslegende li {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .fortschrittslegende span {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: var(--legendenfarbe);
    }

    .core-karte h2 {
      display: none;
    }

    .core-karte:hover,
    .core-karte:focus-visible {
      z-index: 15;
      outline: none;
      transform: translate(-50%, -50%) scale(1.08);
    }

    .vault-tooltip {
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: min(290px, calc(100vw - 24px));
      padding: 11px 13px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 11px;
      color: var(--text);
      background: rgba(10, 14, 23, 0.97);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      font-size: 0.82rem;
      font-weight: 650;
      line-height: 1.4;
      text-align: center;
      white-space: pre-line;
      pointer-events: auto;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 8px);
      transition: opacity 100ms ease, visibility 100ms;
    }

    .vault-tooltip.sichtbar {
      opacity: 1;
      visibility: visible;
    }

    .core-radialmenü {
      position: absolute;
      z-index: 80;
      inset: 0;
      pointer-events: none;
    }

    .core-radialmenü[hidden] {
      display: none;
    }

    .radialaktion {
      position: absolute;
      min-width: 112px;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      color: #eef2f9;
      background: rgba(13, 18, 29, 0.96);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 650;
      cursor: pointer;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(var(--radial-skala, 1));
      transform-origin: center;
    }

    .radialaktion:hover,
    .radialaktion:focus-visible {
      border-color: rgba(130, 166, 255, 0.58);
      background: rgba(32, 43, 65, 0.98);
      outline: none;
    }

    .core-karte.menü-aktiv {
      z-index: 5;
      filter: brightness(1.2);
    }

    .core-raster.radial-fokus .core-karte {
      opacity: 0.34;
      filter: saturate(0.58) brightness(0.62);
    }

    .core-raster.radial-fokus .core-karte.menü-aktiv {
      z-index: 20;
      opacity: 1;
      filter: saturate(1.12) brightness(1.22);
    }

    .core-raster.radial-fokus .themen-linie-basis {
      opacity: 0.18;
      stroke: rgba(238, 242, 249, 0.3);
    }

    .radial-verbinder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .radial-verbinder line {
      stroke: rgba(210, 221, 241, 0.48);
      stroke-width: 1.25;
      stroke-dasharray: 3 4;
      vector-effect: non-scaling-stroke;
    }

    .core-leerstand {
      position: absolute;
      z-index: 75;
      right: 22px;
      bottom: 22px;
      width: min(360px, calc(100% - 44px));
      padding: 13px 15px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      color: #c6cfdd;
      background: rgba(10, 14, 23, 0.96);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .core-leerstand[hidden] {
      display: none;
    }

    .core-leerstand strong {
      display: block;
      margin-bottom: 3px;
      color: #f3f6fb;
    }

    .settings-drawer {
      position: relative;
      z-index: 12;
      display: none;
      grid-column: 3;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
      height: 100%;
      padding: 22px 18px;
      border-left: 1px solid var(--linie);
      background:
        linear-gradient(180deg, rgba(19, 25, 39, 0.82), rgba(9, 13, 22, 0.94)),
        var(--fläche);
      box-shadow: -18px 0 54px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(18px);
      touch-action: pan-x pan-y pinch-zoom;
    }

    .app.settings-offen .settings-drawer {
      display: flex;
    }

    .settings-drawer h2 {
      margin: 0;
      color: #eef2f9;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .settings-drawer .entdeckungsaktion {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      text-align: left;
      text-decoration: none;
    }

    .app.quiz-auswahlmodus .settings-drawer {
      display: none;
    }

    .bottom-app-bar {
      position: fixed;
      z-index: 20;
      inset: auto 0 0;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 96px;
      align-items: center;
      width: 100%;
      min-height: var(--app-bar-höhe);
      padding: 6px max(10px, env(safe-area-inset-right))
        calc(6px + env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      border-top: 1px solid rgba(183, 195, 220, 0.2);
      color: #eef2f9;
      background: rgba(10, 14, 23, 0.94);
      box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(14px);
      touch-action: pan-x pan-y pinch-zoom;
    }

    .bottom-app-bar__seite {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bottom-app-bar__seite--rechts {
      justify-content: flex-end;
    }

    .bottom-app-bar__platzhalter {
      width: 44px;
      height: 44px;

      function coresUnter(knoten) {
        if (Array.isArray(knoten.cores)) return knoten.cores;
        if (Array.isArray(knoten.themen)) return knoten.themen.flatMap(coresUnter);
        if (Array.isArray(knoten.themencluster)) return knoten.themencluster.flatMap(coresUnter);
        if (Array.isArray(knoten.kompetenzen)) return knoten.kompetenzen.flatMap(coresUnter);
        return [];
      }

      function gemittelteGewichte(knoten) {
        const enthalteneCores = coresUnter(knoten);
        const summe = { it: 0, bwl: 0, recht: 0 };
        enthalteneCores.forEach(core => {
          Object.entries(core.category_weights).forEach(([kategorie, gewicht]) => {
            summe[kategorie] += gewicht;
          });
        });
        const gesamt = Object.values(summe).reduce((wert, anteil) => wert + anteil, 0) || 1;
        return Object.fromEntries(
          Object.entries(summe)
            .filter(([, anteil]) => anteil > 0)
            .map(([kategorie, anteil]) => [kategorie, anteil / gesamt])
        );
      }

      function baumZusammenfassung(text, kategorieKnoten) {
        const summary = document.createElement("summary");
        summary.textContent = text;
        summary.style.setProperty("--ordnerfarbe", farbeMischen(gemittelteGewichte(kategorieKnoten)));
        return summary;
      }

      const BAUM_EXPANSION_SCHLÜSSEL = "therealdeal.folder-tree.expansion.v1";

      function baumExpansionLaden() {
        try {
          const gespeichert = JSON.parse(localStorage.getItem(BAUM_EXPANSION_SCHLÜSSEL));
          if (!gespeichert || typeof gespeichert !== "object" || Array.isArray(gespeichert)) {
            return null;
          }
          return gespeichert;
        } catch {
          return null;
        }
      }

      function baumDetailsInitialisieren(details, pfad, standardOffen, gespeichert) {
        details.dataset.baumPfad = pfad;
        details.open = typeof gespeichert?.[pfad] === "boolean"
          ? gespeichert[pfad]
          : standardOffen;
      }

      function baumExpansionSpeichern(baum) {
        const zustand = Object.fromEntries(
          [...baum.querySelectorAll("details[data-baum-pfad]")]
            .map(details => [details.dataset.baumPfad, details.open])
        );
        try {
          localStorage.setItem(BAUM_EXPANSION_SCHLÜSSEL, JSON.stringify(zustand));
        } catch {
          // Der Folder Tree bleibt auch ohne verfügbaren Browserspeicher bedienbar.
        }
      }

      function baumRendern(datensatz) {
        const baum = document.querySelector("#ordnerbaum");
        const gespeicherteExpansion = baumExpansionLaden();
        const lernfeldEintrag = document.createElement("li");
        const lernfeldDetails = document.createElement("details");
        const kompetenzListe = document.createElement("ul");
        lernfeldEintrag.className = "lernfeld";
        baumDetailsInitialisieren(
          lernfeldDetails,
          `lernfeld:${datensatz.lernfeld.id ?? datensatz.lernfeld.number}`,
          true,
          gespeicherteExpansion
        );
        kompetenzListe.className = "ebene kompetenzen";
        lernfeldDetails.append(
          baumZusammenfassung(`Lernfeld ${datensatz.lernfeld.number}`, datensatz.lernfeld),
          kompetenzListe
        );
        lernfeldEintrag.append(lernfeldDetails);
        baum.append(lernfeldEintrag);

        datensatz.lernfeld.kompetenzen.forEach((kompetenz, kompetenzIndex) => {
          const kompetenzEintrag = document.createElement("li");
          const kompetenzDetails = document.createElement("details");
          const clusterListe = document.createElement("ul");
          const kompetenzZusammenfassung = baumZusammenfassung(kompetenz.title, kompetenz);
          kompetenzEintrag.className = "kompetenz";
          baumDetailsInitialisieren(
            kompetenzDetails,
            `kompetenz:${kompetenz.id}`,
            kompetenzIndex === 0,
            gespeicherteExpansion
          );
          clusterListe.className = "ebene clusterliste";
          kompetenzZusammenfassung.dataset.fokusId = `kompetenz:${kompetenz.id}`;
          kompetenzZusammenfassung.dataset.themaIds = kompetenz.themencluster
            .flatMap(cluster => cluster.themen.map(thema => thema.id))
            .join(" ");
          kompetenzDetails.append(
            kompetenzZusammenfassung,
            clusterListe
          );
          kompetenzEintrag.append(kompetenzDetails);
          kompetenzListe.append(kompetenzEintrag);

          kompetenz.themencluster.forEach((cluster, clusterIndex) => {
            const clusterEintrag = document.createElement("li");
            const clusterDetails = document.createElement("details");
            const themenListe = document.createElement("ul");
            const clusterZusammenfassung = baumZusammenfassung(cluster.title, cluster);
            clusterEintrag.className = "cluster";
            baumDetailsInitialisieren(
              clusterDetails,
              `cluster:${cluster.id}`,
              kompetenzIndex === 0 && clusterIndex === 0,
              gespeicherteExpansion
            );
            themenListe.className = "ebene themenliste";
            clusterZusammenfassung.dataset.fokusId = `cluster:${cluster.id}`;
            clusterZusammenfassung.dataset.themaIds = cluster.themen
              .map(thema => thema.id)
              .join(" ");
            clusterDetails.append(
              clusterZusammenfassung,
              themenListe
            );
            clusterEintrag.append(clusterDetails);
            clusterListe.append(clusterEintrag);

            cluster.themen.forEach(thema => {
              const themaEintrag = document.createElement("li");
              themaEintrag.className = "thema";
              themaEintrag.dataset.themaId = thema.id;
              themaEintrag.dataset.fokusId = `thema:${thema.id}`;
              themaEintrag.dataset.themaIds = thema.id;
              themaEintrag.style.setProperty(
                "--ordnerfarbe",
                farbeMischen(gemittelteGewichte(thema))
              );
              themaEintrag.textContent = thema.title;
              themenListe.append(themaEintrag);
              themaTitelZuId.set(thema.title, thema.id);
            });
          });
        });

        baum.addEventListener("toggle", ereignis => {
          if (!(ereignis.target instanceof HTMLDetailsElement)) return;
          baumExpansionSpeichern(baum);
        }, true);
      }

      function baumInteraktionenEinrichten() {
        document.querySelectorAll("summary").forEach(baumeintrag => {
          const bezeichnung = baumeintrag.textContent.trim();
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "baum-checkbox";
          checkbox.disabled = true;
          checkbox.setAttribute("aria-label", `${bezeichnung} auswählen`);
          checkbox.addEventListener("click", ereignis => ereignis.stopPropagation());
          if (baumeintrag.dataset.fokusId) {
            const fokus = document.createElement("button");
            fokus.type = "button";
            fokus.className = "thema-fokus";
            fokus.textContent = bezeichnung;
            fokus.setAttribute("aria-pressed", "false");
            fokus.addEventListener("click", ereignis => {
              ereignis.preventDefault();
              ereignis.stopPropagation();
              bereichFokussieren(
                baumeintrag.dataset.fokusId,
                baumeintrag.dataset.themaIds.split(" "),
                fokus
              );
            });
            baumeintrag.textContent = "";
            baumeintrag.append(checkbox, fokus);
          } else {
            baumeintrag.prepend(checkbox);
          }
        });

        document.querySelectorAll(".thema").forEach(baumeintrag => {
          const bezeichnung = baumeintrag.textContent.trim();
          const checkbox = document.createElement("input");
          const fokus = document.createElement("button");
          checkbox.type = "checkbox";
          checkbox.className = "baum-checkbox";
          checkbox.disabled = true;
          checkbox.setAttribute("aria-label", `${bezeichnung} auswählen`);
          checkbox.addEventListener("click", ereignis => ereignis.stopPropagation());
          fokus.type = "button";
          fokus.className = "thema-fokus";
          fokus.textContent = bezeichnung;
          fokus.setAttribute("aria-pressed", "false");
          fokus.addEventListener("click", () => bereichFokussieren(
            baumeintrag.dataset.fokusId,
            baumeintrag.dataset.themaIds.split(" "),
            fokus
          ));
          baumeintrag.textContent = "";
          baumeintrag.append(checkbox, fokus);
        });
      }

      function themenCheckboxen() {
        return [...document.querySelectorAll(".thema > .baum-checkbox")];
      }

      function nachgeordneteThemenCheckboxen(checkbox) {
        if (checkbox.parentElement.classList.contains("thema")) return [checkbox];
        const details = checkbox.closest("details");
        return details
          ? [...details.querySelectorAll(".thema > .baum-checkbox")]
          : [];
      }

      function elternCheckboxenAktualisieren() {
        document.querySelectorAll(".baum-checkbox").forEach(checkbox => {
          if (checkbox.parentElement.classList.contains("thema")) return;
          const nachgeordneteThemen = nachgeordneteThemenCheckboxen(checkbox);
          const ausgewählt = nachgeordneteThemen
            .filter(themaCheckbox => themaCheckbox.checked).length;
          checkbox.checked =
            nachgeordneteThemen.length > 0 && ausgewählt === nachgeordneteThemen.length;
          checkbox.indeterminate =
            ausgewählt > 0 && ausgewählt < nachgeordneteThemen.length;
        });
      }

      function quizAuswahlAktualisieren() {
        elternCheckboxenAktualisieren();
        const anzahl = themenCheckboxen().filter(checkbox => checkbox.checked).length;
        quizAuswahlStarten.disabled = anzahl === 0;
        quizAuswahlStarten.textContent =
          `Doom Scroll Quiz starten · ${anzahl} ${anzahl === 1 ? "Thema" : "Themen"}`;
      }

      function navigationÜbergangAnimieren(von, zu, beimEnde) {
        navigationÜbergang?.cancel();
        if (matchMedia("(prefers-reduced-motion: reduce)").matches ||
            typeof navigation.animate !== "function") {
          navigation.classList.remove("quiz-übergang-aktiv");
          beimEnde?.();
          return;
        }
        navigation.classList.add("quiz-übergang-aktiv");
        const deltaX = von.left - zu.left;
        const deltaY = von.top - zu.top;
        const zielTransform = getComputedStyle(navigation).transform;
        const animation = navigation.animate([
          {
            transform: `translate(${deltaX}px, ${deltaY}px) ${zielTransform}`,
            width: `${von.width}px`,
            height: `${von.height}px`,
            opacity: String(von.opacity)
          },
          {
            transform: zielTransform,
            width: `${zu.width}px`,
            height: `${zu.height}px`,
            opacity: String(zu.opacity)
          }
        ], {
          duration: 650,
          easing: "cubic-bezier(0.4, 0, 0.2, 1)"
        });
        navigationÜbergang = animation;
        const animationAbschließen = () => {
          if (navigationÜbergang !== animation) return;
          navigation.classList.remove("quiz-übergang-aktiv");
          navigationÜbergang = null;
          beimEnde?.();
        };
        animation.finished.then(animationAbschließen, animationAbschließen);
      }

      function navigationRechteck() {
        const rechteck = navigation.getBoundingClientRect();
        return {
          left: rechteck.left,
          top: rechteck.top,
          width: rechteck.width,
          height: rechteck.height
        };
      }

      function quizAuswahlmodusBeenden() {
        const start = navigationRechteck();
        quizAuswahlAktiv = false;
        app.classList.remove("quiz-auswahlmodus");
        quizAuswahlhinweis.hidden = true;
        quizAuswahlaktionen.hidden = true;
        appBarDoomScrollQuiz.setAttribute("aria-pressed", "false");
        document.querySelectorAll(".baum-checkbox").forEach(checkbox => {
          checkbox.checked = false;
          checkbox.indeterminate = false;
          checkbox.disabled = true;
        });
        quizAuswahlAktualisieren();
        const ziel = navigationRechteck();
        navigationÜbergangAnimieren(
          { ...start, opacity: 1 },
          { ...ziel, opacity: navigationWarSichtbarVorQuiz ? 1 : 0 },
          () => folderTreeSichtbarSetzen(navigationWarSichtbarVorQuiz)
        );
      }

      function quizAuswahlmodusStarten() {
        bereichsfokusZurücksetzen();
        settingsDrawerSichtbarSetzen(false);
        navigationWarSichtbarVorQuiz = !app.classList.contains("navigation-geschlossen");
        folderTreeSichtbarSetzen(true);
        const start = navigationRechteck();
        quizAuswahlAktiv = true;
        quizAußenPointerId = null;
        quizAußenKlickUnterdrücken = false;
        coreMenüSchließen();
        app.classList.add("quiz-auswahlmodus");
        quizAuswahlhinweis.hidden = false;
        quizAuswahlaktionen.hidden = false;
        appBarDoomScrollQuiz.setAttribute("aria-pressed", "true");
        document.querySelectorAll(".baum-checkbox").forEach(checkbox => {
          checkbox.checked = false;
          checkbox.indeterminate = false;
          checkbox.disabled = nachgeordneteThemenCheckboxen(checkbox).length === 0;
        });
        quizAuswahlAktualisieren();
        const ziel = navigationRechteck();
        navigationÜbergangAnimieren(
          { ...start, opacity: navigationWarSichtbarVorQuiz ? 1 : 0 },
          { ...ziel, opacity: 1 }
        );
      }

      function quizAuswahlmodusUmschalten() {
        if (quizAuswahlAktiv) quizAuswahlmodusBeenden();
        else quizAuswahlmodusStarten();
      }

      appBarDoomScrollQuiz.addEventListener("click", quizAuswahlmodusUmschalten);

      document.querySelector("#ordnerbaum").addEventListener("change", ereignis => {
        if (!quizAuswahlAktiv || !ereignis.target.matches(".baum-checkbox")) return;
        const checkbox = ereignis.target;
        if (!checkbox.parentElement.classList.contains("thema")) {
          nachgeordneteThemenCheckboxen(checkbox).forEach(themaCheckbox => {
            themaCheckbox.checked = checkbox.checked;
          });
        }
        quizAuswahlAktualisieren();
      });

      quizAuswahlAbbrechen.addEventListener("click", quizAuswahlmodusBeenden);

      quizAuswahlStarten.addEventListener("click", () => {
        const ausgewählteThemen = themenCheckboxen()
          .filter(checkbox => checkbox.checked)
          .map(checkbox => checkbox.parentElement.dataset.themaId);
        if (ausgewählteThemen.length === 0) return;
        const parameter = new URLSearchParams();
        ausgewählteThemen.forEach(themaId => parameter.append("thema", themaId));
        quizAuswahlmodusBeenden();
        location.href = `doom-scroll-quiz.html?${parameter}`;
      });

      document.addEventListener("pointerdown", ereignis => {
        if (!quizAuswahlAktiv || ereignis.target.closest(".navigation")) return;
        quizAußenPointerId = ereignis.pointerId;
        quizAußenKlickUnterdrücken = true;
        ereignis.preventDefault();
        ereignis.stopImmediatePropagation();
        quizAuswahlmodusBeenden();
      }, true);

      document.addEventListener("pointerup", ereignis => {
        if (ereignis.pointerId !== quizAußenPointerId) return;
        quizAußenPointerId = null;
        ereignis.preventDefault();
        ereignis.stopImmediatePropagation();
      }, true);

      document.addEventListener("pointercancel", ereignis => {
        if (ereignis.pointerId !== quizAußenPointerId) return;
        quizAußenPointerId = null;
        quizAußenKlickUnterdrücken = false;
        ereignis.stopImmediatePropagation();
      }, true);

      document.addEventListener("click", ereignis => {
        if (quizAuswahlAktiv && !ereignis.target.closest(".navigation")) {
          ereignis.preventDefault();
          ereignis.stopImmediatePropagation();
          quizAuswahlmodusBeenden();
          return;
        }
        if (quizAußenKlickUnterdrücken) {
          quizAußenKlickUnterdrücken = false;
          ereignis.preventDefault();
          ereignis.stopImmediatePropagation();
        }
      }, true);

      const aktiveDatendateien = [
        "Lernfelder.json",
        "Themen.json",
        "Cores.json",
        "Core-Ausprägungen.json",
        "Quellen.json"
      ];

      async function datenLaden() {
        if (location.protocol === "file:") return eingebetteteDatenpakete;
        try {
          const antwortpaare = await Promise.all(
            aktiveDatendateien.map(async dateiname => {
              const antwort = await fetch(dateiname, { cache: "no-store" });
              if (!antwort.ok) throw new Error(`${dateiname}: HTTP ${antwort.status}`);
              return [dateiname, await antwort.json()];
            })
          );
          return Object.fromEntries(antwortpaare);
        } catch (fehler) {
          console.warn("Split-Datensätze nicht erreichbar; eingebetteter Stand wird verwendet.", fehler);
          return eingebetteteDatenpakete;
        }
      }

      function datenZusammenbauen(pakete) {
        const lernfelderDatei = pakete["Lernfelder.json"];
        const themenDatei = pakete["Themen.json"];
        const coresDatei = pakete["Cores.json"];
        const ausprägungenDatei = pakete["Core-Ausprägungen.json"];
        const quellenDatei = pakete["Quellen.json"];
        const dateien = [
          lernfelderDatei,
          themenDatei,
          coresDatei,
          ausprägungenDatei,
          quellenDatei
        ];
        if (dateien.some(datei => datei?.schema_version !== "3.0.0")) {
          throw new Error("Nicht unterstützte oder unvollständige Split-Datensätze.");
        }

        const coreNachId = new Map(coresDatei.cores.map(core => [core.id, core]));
        const titelNormalisieren = wert =>
          wert
            .normalize("NFKD")
            .replace(/\p{M}/gu, "")
            .toLocaleLowerCase("de-DE")
            .replace(/[^a-z0-9]+/g, "");
        const coreTitelNormalisiert = new Set(
          coresDatei.cores.flatMap(core =>
            [core.short_title, core.title].map(titelNormalisieren)
          )
        );
        themenDatei.themen.forEach(thema => {
          if (coreTitelNormalisiert.has(titelNormalisieren(thema.title))) {
            throw new Error(
              `Thema verletzt THEMA-EIGENSTAENDIGKEIT-1 durch Core-Titelgleichheit: ${thema.id}`
            );
          }
        });
        coresDatei.cores.forEach(core => {
          if (!core.relevance_reason || !core.evidence_source_refs?.length) {
            throw new Error(`Unvollständige fachliche Core-Begründung: ${core.id}`);
          }
        });
        const quelleNachId = new Map(quellenDatei.quellen.map(quelle => [quelle.id, quelle]));
        const ausprägungenNachThema = new Map();
        ausprägungenDatei.core_ausprägungen.forEach(ausprägung => {
          if (!coreNachId.has(ausprägung.core_ref)) {
            throw new Error(`Unbekannter Core-Verweis: ${ausprägung.core_ref}`);
          }
          ausprägung.source_refs.forEach(quellenbezug => {
            if (!quelleNachId.has(quellenbezug.source_id)) {
              throw new Error(`Unbekannter Quellen-Verweis: ${quellenbezug.source_id}`);
            }
          });
          if (!ausprägungenDatei.depth_values.includes(ausprägung.tiefengrad)) {
            throw new Error(`Ungültiger Tiefengrad: ${ausprägung.tiefengrad}`);
          }
          if (!ausprägungenNachThema.has(ausprägung.thema_ref)) {
            ausprägungenNachThema.set(ausprägung.thema_ref, []);
          }
          ausprägungenNachThema.get(ausprägung.thema_ref).push(ausprägung);
        });
        const themenJeCore = new Map();
        ausprägungenDatei.core_ausprägungen.forEach(ausprägung => {
          if (!themenJeCore.has(ausprägung.core_ref)) {
            themenJeCore.set(ausprägung.core_ref, new Set());
          }
          themenJeCore.get(ausprägung.core_ref).add(ausprägung.thema_ref);
        });
        themenDatei.themen.forEach(thema => {
          const vorkommen = ausprägungenNachThema.get(thema.id) || [];
          if (
            vorkommen.length &&
            !vorkommen.some(
              ausprägung => themenJeCore.get(ausprägung.core_ref)?.size === 1
            )
          ) {
            throw new Error(
              `Thema verletzt THEMA-EIGENSTAENDIGKEIT-1 durch fehlende eigene Core-Substanz: ${thema.id}`
            );
          }
        });

        const lernfeldQuelle = lernfelderDatei.lernfelder[0];
        const lernfeld = {
          id: lernfeldQuelle.id,
          number: lernfeldQuelle.number,
          title: lernfeldQuelle.title,
          official_source_ref: lernfeldQuelle.official_source_ref,
          kompetenzen: lernfeldQuelle.kompetenzen
            .slice()
            .sort((a, b) => a.sort_order - b.sort_order)
            .map(kompetenz => ({
              id: kompetenz.id,
              title: kompetenz.title,
              derivation: kompetenz.derivation,
              themencluster: themenDatei.themencluster
                .filter(cluster => cluster.kompetenz_ref === kompetenz.id)
                .sort((a, b) => a.sort_order - b.sort_order)
                .map(cluster => ({
                  id: cluster.id,
                  title: cluster.title,
                  themen: themenDatei.themen
                    .filter(thema => thema.themencluster_ref === cluster.id)
                    .sort((a, b) => a.sort_order - b.sort_order)
                    .map(thema => {
                      const vorkommen = (ausprägungenNachThema.get(thema.id) || [])
                        .filter(ausprägung =>
                          ausprägung.lernfeld_ref === lernfeldQuelle.id &&
                          ausprägung.kompetenz_ref === kompetenz.id &&
                          ausprägung.themencluster_ref === cluster.id
                        )
                        .sort((a, b) => a.sort_order - b.sort_order);
                      if (!vorkommen.length) {
                        throw new Error(`Sichtbares Thema ohne Core-Ausprägung: ${thema.id}`);
                      }
                      return {
                        id: thema.id,
                        title: thema.title,
                        cores: vorkommen.map(ausprägung => {
                          const core = coreNachId.get(ausprägung.core_ref);
                          return {
                            id: ausprägung.id,
                            identity_key: core.identity_key,
                            short_title: core.short_title,
                            title: core.title,
                            content: ausprägung.context_content || core.content,
                            topic_ref: ausprägung.thema_ref,
                            tiefengrad: ausprägung.tiefengrad,
                            category_weights: core.category_weights,
                            relevance_reason: core.relevance_reason,
                            evidence_source_refs: core.evidence_source_refs,
                            source_refs: ausprägung.source_refs
                          };
                        })
                      };
                    })
                }))
            }))
        };
        return { schema_version: "3.0.0", lernfeld };
      }

      function farbeMischen(gewichte) {
        const basis = {
          it: [37, 99, 235],
          bwl: [250, 204, 21],
          recht: [220, 38, 38]
        };
        const rgb = [0, 1, 2].map(kanal => Math.round(
          Object.entries(gewichte).reduce(
            (summe, [kategorie, gewicht]) => summe + basis[kategorie][kanal] * gewicht,
            0
          )
        ));
        return `rgb(${rgb.join(", ")})`;
      }

      const datenpakete = await datenLaden();
      const daten = datenZusammenbauen(datenpakete);
      if (!daten.lernfeld?.kompetenzen) {
        throw new Error("Die normalisierten Datensätze konnten nicht zusammengesetzt werden.");
      }
      baumRendern(daten);
      baumInteraktionenEinrichten();
      const cores = [];
      daten.lernfeld.kompetenzen.forEach(kompetenz => {
        kompetenz.themencluster.forEach(cluster => {
          cluster.themen.forEach(thema => {
            if (thema.title) themaTitelZuId.set(thema.title, thema.id);
            thema.cores.forEach(core => {
              cores.push([
                core.title || core.short_title,
                farbeMischen(core.category_weights),
                [core.topic_ref || thema.id]
              ]);
            });
          });
        });
      });

      const prototypStützwerte = [0, 10, 30, 50, 100];
      const beispielFortschritte = cores.map((core, index) =>
        prototypStützwerte[index] ?? ((index * 37 + 11) % 100 + 1)
      );
      const prototypKategorien = [
        { name: "BWL", farbe: "rgb(250, 204, 21)" },
        { name: "WiSo", farbe: "rgb(249, 115, 22)" },
        { name: "Recht", farbe: "rgb(139, 92, 246)" },
        { name: "Mathematik", farbe: "rgb(6, 182, 212)" },
        { name: "Security", farbe: "rgb(217, 70, 239)" },
        { name: "Softwareentwicklung", farbe: "rgb(34, 197, 94)" },
        { name: "Infrastruktur", farbe: "rgb(37, 99, 235)" }
      ];
      const beispielKategorien = cores.map(
        (core, index) => prototypKategorien[index % prototypKategorien.length]
      );

      const positionen = cores.map((core, index) => {
        const winkel = index * 2.3999632297;
        const radius = 54 * Math.sqrt(index + 1);
        return {
          x: WELT_BREITE / 2 + Math.cos(winkel) * radius * 1.18,
          y: WELT_HÖHE / 2 + Math.sin(winkel) * radius,
          vx: 0,
          vy: 0,
          fixiert: false
        };
      });

      const themen = new Map();
      cores.forEach(([, , zuordnungen = []], index) => {
        zuordnungen.forEach(thema => {
          if (!themen.has(thema)) themen.set(thema, []);
          themen.get(thema).push(index);
        });
      });

      const kanten = [];
      themen.forEach((indizes, thema) => {
        if (indizes.length < 2) return;
        for (let index = 1; index < indizes.length; index += 1) {
          kanten.push({ a: indizes[index - 1], b: indizes[index], thema });
        }
        if (indizes.length > 2) {
          kanten.push({ a: indizes[indizes.length - 1], b: indizes[0], thema });
        }
      });

      const basisPfad = linienEbene.querySelector(".themen-linie-basis");
      const fokusPfad = linienEbene.querySelector(".themen-linie-fokus");

      function coreBeschriftung(index) {
        const titel = cores[index][0];
        return fortschrittPrototypAktiv
          ? `${titel}, ${beispielFortschritte[index]} %`
          : titel;
      }

      function coreTooltipText(index) {
        const titel = cores[index][0];
        return fortschrittPrototypAktiv
          ? `${titel}\n${beispielFortschritte[index]} %`
          : titel;
      }

      const knotenElemente = [];
      raster.classList.add("fortschritt-prototyp");
      cores.forEach(([titelText, farbe, zuordnungen = []], index) => {
        const punkt = document.createElement("button");
        const fortschrittsring = document.createElement("span");
        const titel = document.createElement("h2");
        punkt.className = "core-karte";
        punkt.type = "button";
        punkt.style.setProperty("--core-farbe", farbe);
        punkt.style.setProperty(
          "--prototyp-kategoriefarbe",
          beispielKategorien[index].farbe
        );
        punkt.style.setProperty("--core-größe", `${CORE_GRÖSSE}px`);
        punkt.style.setProperty(
          "--core-fortschrittswinkel",
          `${beispielFortschritte[index] * 3.6}deg`
        );
        punkt.style.setProperty(
          "--core-fortschrittsring-sichtbar",
          beispielFortschritte[index] === 0 ? "0" : "1"
        );
        punkt.style.left = `${positionen[index].x}px`;
        punkt.style.top = `${positionen[index].y}px`;
        punkt.dataset.index = index;
        punkt.dataset.fortschritt = beispielFortschritte[index];
        punkt.dataset.prototypKategorie = beispielKategorien[index].name;
        punkt.dataset.themen = zuordnungen.join(" ");
        punkt.setAttribute("aria-label", coreBeschriftung(index));
        fortschrittsring.className = "core-fortschrittsring";
        fortschrittsring.setAttribute("aria-hidden", "true");
        titel.textContent = titelText;
        punkt.append(fortschrittsring, titel);
        raster.append(punkt);
        knotenElemente.push(punkt);
      });

      fortschrittsPrototyp.addEventListener("click", () => {
        fortschrittPrototypAktiv = !fortschrittPrototypAktiv;
        raster.classList.toggle("fortschritt-prototyp", fortschrittPrototypAktiv);
        fortschrittsPrototyp.setAttribute(
          "aria-pressed",
          String(fortschrittPrototypAktiv)
        );
        fortschrittslegende.hidden = !fortschrittPrototypAktiv;
        knotenElemente.forEach((punkt, index) => {
          punkt.setAttribute("aria-label", coreBeschriftung(index));
        });
        tooltip.classList.remove("sichtbar");
      });

      raster.addEventListener("pointerover", ereignis => {
        const punkt = ereignis.target.closest(".core-karte");
        if (!punkt || punkt.contains(ereignis.relatedTarget)) return;
        tooltip.textContent = coreTooltipText(Number(punkt.dataset.index));
        tooltip.classList.add("sichtbar");
        tooltip.style.left = `${ereignis.clientX}px`;
        tooltip.style.top = `${ereignis.clientY + 16}px`;
      });
      raster.addEventListener("pointermove", ereignis => {
        if (!ereignis.target.closest(".core-karte")) return;
        tooltip.style.left = `${ereignis.clientX}px`;
        tooltip.style.top = `${ereignis.clientY + 16}px`;
      });
      raster.addEventListener("pointerout", ereignis => {
        const punkt = ereignis.target.closest(".core-karte");
        if (punkt &&
            !punkt.contains(ereignis.relatedTarget) &&
            !tooltip.contains(ereignis.relatedTarget)) {
          tooltip.classList.remove("sichtbar");
        }
      });
      tooltip.addEventListener("pointerleave", () => {
        tooltip.classList.remove("sichtbar");
      });
      raster.addEventListener("focusin", ereignis => {
        const punkt = ereignis.target.closest(".core-karte");
        if (!punkt) return;
        const rechteck = punkt.getBoundingClientRect();
        tooltip.textContent = coreTooltipText(Number(punkt.dataset.index));
        tooltip.style.left = `${rechteck.left + rechteck.width / 2}px`;
        tooltip.style.top = `${rechteck.bottom + 12}px`;
        tooltip.classList.add("sichtbar");
      });
      raster.addEventListener("focusout", ereignis => {
        if (ereignis.target.closest(".core-karte")) tooltip.classList.remove("sichtbar");
      });
      raster.addEventListener("pointerdown", ereignis => {
        const punkt = ereignis.target.closest(".core-karte");
        if (punkt) knotenZiehenStarten(ereignis, Number(punkt.dataset.index), punkt);
      });
    raster.addEventListener("click", ereignis => {
      const punkt = ereignis.target.closest(".core-karte");
      if (!punkt) return;
      ereignis.stopPropagation();
      if (aktivesThema) return;
      const index = Number(punkt.dataset.index);
      if (unterdrückterCoreKlick === index) {
        unterdrückterCoreKlick = null;
          return;
        }
        coreMenüUmschalten(index);
      });

      function radialMenüPositionieren() {
        if (aktiverCoreIndex === null || radialMenü.hidden) return;
        const viewportRechteck = viewport.getBoundingClientRect();
        const weltpunkt = positionen[aktiverCoreIndex];
        const mitteX = weltpunkt.x * zoom + verschiebungX;
        const mitteY = weltpunkt.y * zoom + verschiebungY;
        let winkel = [-90, 30, 150];
        if (mitteX < 170) winkel = [-60, 0, 60];
        else if (viewportRechteck.width - mitteX < 170) winkel = [120, 180, 240];
        else if (mitteY < 105) winkel = [30, 90, 150];
        else if (viewportRechteck.height - mitteY < 105) winkel = [-150, -90, -30];
        const radius = Math.max(82, Math.min(132, 260 * zoom));
        const menüSkala = Math.max(0.9, Math.min(1.08, 0.84 + zoom * 0.5));
        radialMenü.style.setProperty("--radial-skala", menüSkala);
        const verbinder = radialMenü.querySelectorAll(".radial-verbinder line");
        radialMenü.querySelectorAll(".radialaktion").forEach((aktion, index) => {
          const bogenmaß = winkel[index] * Math.PI / 180;
          const x = Math.max(68, Math.min(
            viewportRechteck.width - 68,
            mitteX + Math.cos(bogenmaß) * radius
          ));
          const y = Math.max(24, Math.min(
            viewportRechteck.height - 24,
            mitteY + Math.sin(bogenmaß) * radius
          ));
          aktion.style.left = `${x}px`;
          aktion.style.top = `${y}px`;
          verbinder[index].setAttribute("x1", mitteX);
          verbinder[index].setAttribute("y1", mitteY);
          verbinder[index].setAttribute("x2", x);
          verbinder[index].setAttribute("y2", y);
        });
      }

      function coreMenüSchließen() {
        if (aktiverCoreIndex !== null) {
          knotenElemente[aktiverCoreIndex]?.classList.remove("menü-aktiv");
        }
        aktiverCoreIndex = null;
        raster.classList.remove("radial-fokus");
        radialMenü.hidden = true;
      }

      function coreMenüUmschalten(index) {
        if (aktiverCoreIndex === index) {
          coreMenüSchließen();
          return;
        }
        coreMenüSchließen();
        aktiverCoreIndex = index;
        knotenElemente[index].classList.add("menü-aktiv");
        raster.classList.add("radial-fokus");
        tooltip.classList.remove("sichtbar");
        coreLeerstand.hidden = true;
        radialMenü.hidden = false;
        radialMenüPositionieren();
      }

      radialMenü.querySelectorAll(".radialaktion").forEach(aktion => {
        aktion.addEventListener("pointerdown", ereignis => ereignis.stopPropagation());
        aktion.addEventListener("click", ereignis => {
          ereignis.stopPropagation();
          const coreTitel = cores[aktiverCoreIndex]?.[0] || "Core";
          const aktionsname = aktion.dataset.aktion;
          if (aktionsname === "Doom Scroll Quiz") {
            coreMenüSchließen();
            location.href = "doom-scroll-quiz.html";
            return;
          }
          const überschrift = document.createElement("strong");
          const hinweis = document.createElement("span");
          überschrift.textContent = `${aktionsname} · ${coreTitel}`;
          hinweis.textContent =
            "Für diesen Core sind in diesem Bereich noch keine Inhalte hinterlegt.";
          coreLeerstand.replaceChildren(überschrift, hinweis);
          coreLeerstand.hidden = false;
          coreMenüSchließen();
        });
      });

      function graphElementeAktualisieren() {
        knotenElemente.forEach((punkt, index) => {
          punkt.style.left = `${positionen[index].x}px`;
          punkt.style.top = `${positionen[index].y}px`;
        });
        basisPfad.setAttribute("d", pfadErstellen(kanten));
        if (aktivesThema) {
          fokusPfad.setAttribute(
            "d",
            pfadErstellen(kanten.filter(kante => aktiveThemenIds.has(kante.thema)))
          );
        }
        radialMenüPositionieren();
      }

      function pfadErstellen(kantenAuswahl) {
        return kantenAuswahl.map(kante => {
          const a = positionen[kante.a];
          const b = positionen[kante.b];
          return `M${a.x.toFixed(1)},${a.y.toFixed(1)}L${b.x.toFixed(1)},${b.y.toFixed(1)}`;
        }).join("");
      }

      function simulationsSchritt(alpha) {
        const abstoßung = 26000 * alpha;
        const gravitation = 0.0032 * alpha;
        const federkraft = 0.018 * alpha;

        const zellengröße = CORE_LAYOUT_GRÖSSE * 2.6;
        const zellen = new Map();
        positionen.forEach((punkt, index) => {
          const x = Math.floor(punkt.x / zellengröße);
          const y = Math.floor(punkt.y / zellengröße);
          const schlüssel = x * 1048576 + y;
          if (!zellen.has(schlüssel)) zellen.set(schlüssel, []);
          zellen.get(schlüssel).push(index);
        });

        for (let a = 0; a < positionen.length; a += 1) {
          const zelleX = Math.floor(positionen[a].x / zellengröße);
          const zelleY = Math.floor(positionen[a].y / zellengröße);
          for (let offsetX = -1; offsetX <= 1; offsetX += 1) {
            for (let offsetY = -1; offsetY <= 1; offsetY += 1) {
              const nachbarn = zellen.get(
                (zelleX + offsetX) * 1048576 + zelleY + offsetY
              );
              if (!nachbarn) continue;
              for (const b of nachbarn) {
                if (b <= a) continue;
            const pa = positionen[a];
            const pb = positionen[b];
            let dx = pb.x - pa.x;
            let dy = pb.y - pa.y;
            let quadrat = dx * dx + dy * dy;
            if (quadrat < 0.01) {
              dx = ((a * 17 + b * 31) % 7 - 3) * 0.1;
              dy = ((a * 29 + b * 13) % 7 - 3) * 0.1;
              quadrat = dx * dx + dy * dy;
            }
            const distanz = Math.sqrt(quadrat);
            const kraft = Math.min(4.2, abstoßung / quadrat);
            const fx = dx / distanz * kraft;
            const fy = dy / distanz * kraft;
            if (!pa.fixiert) {
              pa.vx -= fx;
              pa.vy -= fy;
            }
            if (!pb.fixiert) {
              pb.vx += fx;
              pb.vy += fy;
            }

            const radiusA = CORE_LAYOUT_GRÖSSE / 2;
            const radiusB = CORE_LAYOUT_GRÖSSE / 2;
            const mindestabstand = radiusA + radiusB + 18;
            if (distanz < mindestabstand) {
              const kollisionskraft = (mindestabstand - distanz) * 0.055 * alpha;
              const kx = dx / distanz * kollisionskraft;
              const ky = dy / distanz * kollisionskraft;
              if (!pa.fixiert) {
                pa.vx -= kx;
                pa.vy -= ky;
              }
              if (!pb.fixiert) {
                pb.vx += kx;
                pb.vy += ky;
              }
            }
              }
            }
          }
        }

        kanten.forEach(kante => {
          const pa = positionen[kante.a];
          const pb = positionen[kante.b];
          const dx = pb.x - pa.x;
          const dy = pb.y - pa.y;
          const distanz = Math.max(0.1, Math.hypot(dx, dy));
          const kraft = (distanz - FEDERLÄNGE) * federkraft;
          const fx = dx / distanz * kraft;
          const fy = dy / distanz * kraft;
          if (!pa.fixiert) {
            pa.vx += fx;
            pa.vy += fy;
          }
          if (!pb.fixiert) {
            pb.vx -= fx;
            pb.vy -= fy;
          }
        });

        positionen.forEach((punkt, index) => {
          if (punkt.fixiert) return;
          punkt.vx += (WELT_BREITE / 2 - punkt.x) * gravitation;
          punkt.vy += (WELT_HÖHE / 2 - punkt.y) * gravitation;
          punkt.vx *= 0.78;
          punkt.vy *= 0.78;
          punkt.x += punkt.vx;
          punkt.y += punkt.vy;
        });
      }

      let simulationsLauf = 0;

      function simulationStarten({ automatischEinpassen = false, schritte = 100 } = {}) {
        const eigenerLauf = ++simulationsLauf;
        let iteration = 0;
        raster.dataset.simulation = "läuft";
        function frame() {
          if (eigenerLauf !== simulationsLauf) return;
          for (let schritt = 0; schritt < 4; schritt += 1) {
            const alpha = Math.max(0.06, 1 - iteration / schritte);
            simulationsSchritt(alpha);
            iteration += 1;
          }
          graphElementeAktualisieren();
          if (automatischEinpassen && iteration % 32 === 0) einpassen();
          const bewegung = positionen.reduce(
            (summe, punkt) => summe + Math.hypot(punkt.vx, punkt.vy),
            0
          ) / positionen.length;
          if (iteration < schritte && (iteration < 48 || bewegung > 0.045)) {
            requestAnimationFrame(frame);
          } else {
            raster.dataset.simulation = "gesetzt";
            if (automatischEinpassen) einpassen();
          }
        }
        requestAnimationFrame(frame);
      }

      graphElementeAktualisieren();

      function bereichFokussieren(fokusId, themaIds, auslöser) {
        if (quizAuswahlAktiv) return;
        coreMenüSchließen();
        const zurücksetzen = aktivesThema === fokusId;
        aktivesThema = zurücksetzen ? null : fokusId;
        aktiveThemenIds = new Set(zurücksetzen ? [] : themaIds);

        document.querySelectorAll(".thema-fokus").forEach(schaltfläche => {
          schaltfläche.setAttribute(
            "aria-pressed",
            String(!zurücksetzen && schaltfläche === auslöser)
          );
        });

        fokusDarstellungAktualisieren();
      }

      function bereichsfokusZurücksetzen() {
        if (!aktivesThema) return;
        aktivesThema = null;
        aktiveThemenIds = new Set();
        document.querySelectorAll(".thema-fokus").forEach(schaltfläche => {
          schaltfläche.setAttribute("aria-pressed", "false");
        });
        fokusDarstellungAktualisieren();
      }

      function fokusDarstellungAktualisieren() {
        knotenElemente.forEach(punkt => {
          const passt = aktivesThema && punkt.dataset.themen
            .split(" ")
            .some(themaId => aktiveThemenIds.has(themaId));
          punkt.classList.toggle("hervorgehoben", Boolean(passt));
          punkt.classList.toggle("abgeblendet", Boolean(aktivesThema && !passt));
        });
        linienEbene.classList.toggle("fokus-aktiv", Boolean(aktivesThema));
        fokusPfad.setAttribute(
          "d",
          aktivesThema
            ? pfadErstellen(kanten.filter(kante => aktiveThemenIds.has(kante.thema)))
            : ""
        );
      }

      let zoom = 0.34;
      let verschiebungX = 0;
      let verschiebungY = 0;
      let zieht = false;
      let letzterPunkt = null;
      let hintergrundStartPunkt = null;
      let hintergrundBewegt = false;
      let gezogenerKnoten = null;
      let dragSimulationsLauf = 0;
      const vaultZeiger = new Map();
      let vaultPinch = null;

      function transformationAnwenden() {
        raster.style.transform = `translate(${verschiebungX}px, ${verschiebungY}px) scale(${zoom})`;
        radialMenüPositionieren();
      }

      function graphGrenzenBerechnen() {
        return positionen.reduce((grenzen, punkt, index) => {
          const radius = CORE_LAYOUT_GRÖSSE / 2 + 24;
          grenzen.links = Math.min(grenzen.links, punkt.x - radius);
          grenzen.rechts = Math.max(grenzen.rechts, punkt.x + radius);
          grenzen.oben = Math.min(grenzen.oben, punkt.y - radius);
          grenzen.unten = Math.max(grenzen.unten, punkt.y + radius);
          return grenzen;
        }, {
          links: Infinity,
          rechts: -Infinity,
          oben: Infinity,
          unten: -Infinity
        });
      }

      function einpassen() {
        const rand = 36;
        const graphGrenzen = graphGrenzenBerechnen();
        const graphBreite = Math.max(1, graphGrenzen.rechts - graphGrenzen.links);
        const graphHöhe = Math.max(1, graphGrenzen.unten - graphGrenzen.oben);
        zoom = Math.max(0.12, Math.min(
          1.1,
          Math.max(1, viewport.clientWidth - rand * 2) / graphBreite,
          Math.max(1, viewport.clientHeight - rand * 2) / graphHöhe
        ));
        const graphMitteX = (graphGrenzen.links + graphGrenzen.rechts) / 2;
        const graphMitteY = (graphGrenzen.oben + graphGrenzen.unten) / 2;
        verschiebungX = viewport.clientWidth / 2 - graphMitteX * zoom;
        verschiebungY = viewport.clientHeight / 2 - graphMitteY * zoom;
        transformationAnwenden();
      }

      function knotenZiehenStarten(ereignis, index, element) {
        if (ereignis.button !== 0) return;
        ereignis.preventDefault();
        ereignis.stopPropagation();
        gezogenerKnoten = {
          index,
          element,
          pointerId: ereignis.pointerId,
          startX: ereignis.clientX,
          startY: ereignis.clientY,
          ursprungX: positionen[index].x,
          ursprungY: positionen[index].y,
          zielX: positionen[index].x,
          zielY: positionen[index].y,
          aktiv: false
        };
        element.setPointerCapture(ereignis.pointerId);
      }

      function gezogenenKnotenPositionAnwenden() {
        if (!gezogenerKnoten?.aktiv) return;
        const punkt = positionen[gezogenerKnoten.index];
        punkt.fixiert = true;
        punkt.vx = 0;
        punkt.vy = 0;
        punkt.x = gezogenerKnoten.zielX;
        punkt.y = gezogenerKnoten.zielY;
      }

      function dragSimulationStarten(pointerId) {
        const eigenerLauf = ++dragSimulationsLauf;
        simulationsLauf += 1;
        raster.dataset.simulation = "läuft";

        function frame() {
          if (eigenerLauf !== dragSimulationsLauf ||
              !gezogenerKnoten?.aktiv ||
              gezogenerKnoten.pointerId !== pointerId) return;
          gezogenenKnotenPositionAnwenden();
          simulationsSchritt(0.38);
          simulationsSchritt(0.38);
          graphElementeAktualisieren();
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      function zoomSetzen(neuerZoom, fokusX, fokusY) {
        const begrenzt = Math.max(0.12, Math.min(1.5, neuerZoom));
        const weltX = (fokusX - verschiebungX) / zoom;
        const weltY = (fokusY - verschiebungY) / zoom;
        zoom = begrenzt;
        verschiebungX = fokusX - weltX * zoom;
        verschiebungY = fokusY - weltY * zoom;
        transformationAnwenden();
      }

      viewport.addEventListener("wheel", ereignis => {
        if (ereignis.ctrlKey || ereignis.metaKey) return;
        ereignis.preventDefault();
        const rechteck = viewport.getBoundingClientRect();
        zoomSetzen(
          zoom * Math.exp(-ereignis.deltaY * 0.0012),
          ereignis.clientX - rechteck.left,
          ereignis.clientY - rechteck.top
        );
      }, { passive: false });

      viewport.addEventListener("pointerdown", ereignis => {
        if (ereignis.pointerType === "touch") {
          vaultZeiger.set(ereignis.pointerId, {
            x: ereignis.clientX,
            y: ereignis.clientY
          });
          if (vaultZeiger.size === 2) {
            const [a, b] = [...vaultZeiger.values()];
            vaultPinch = {
              abstand: Math.max(1, Math.hypot(b.x - a.x, b.y - a.y)),
              zoom
            };
            zieht = false;
            hintergrundBewegt = true;
            viewport.classList.remove("zieht");
            viewport.setPointerCapture(ereignis.pointerId);
            return;
          }
        }
        if (ereignis.button !== 0 || !ereignis.isPrimary) return;
        if (ereignis.target.closest(".core-karte")) return;
        if (ereignis.target.closest(".radialaktion")) return;
        if (ereignis.target.closest(".fortschrittslegende")) return;
        zieht = true;
        hintergrundBewegt = false;
        letzterPunkt = { x: ereignis.clientX, y: ereignis.clientY };
        hintergrundStartPunkt = { ...letzterPunkt };
        viewport.classList.add("zieht");
        viewport.setPointerCapture(ereignis.pointerId);
      });

      viewport.addEventListener("pointermove", ereignis => {
        if (vaultZeiger.has(ereignis.pointerId)) {
          vaultZeiger.set(ereignis.pointerId, {
            x: ereignis.clientX,
            y: ereignis.clientY
          });
          if (vaultPinch && vaultZeiger.size >= 2) {
            const [a, b] = [...vaultZeiger.values()];
            const rechteck = viewport.getBoundingClientRect();
            const abstand = Math.max(1, Math.hypot(b.x - a.x, b.y - a.y));
            zoomSetzen(
              vaultPinch.zoom * abstand / vaultPinch.abstand,
              (a.x + b.x) / 2 - rechteck.left,
              (a.y + b.y) / 2 - rechteck.top
            );
            return;
          }
        }
        if (gezogenerKnoten && ereignis.pointerId === gezogenerKnoten.pointerId) {
          const dx = (ereignis.clientX - gezogenerKnoten.startX) / zoom;
          const dy = (ereignis.clientY - gezogenerKnoten.startY) / zoom;
          if (!gezogenerKnoten.aktiv && Math.hypot(dx, dy) > 4 / zoom) {
            gezogenerKnoten.aktiv = true;
            gezogenerKnoten.element.classList.add("wird-gezogen");
            positionen[gezogenerKnoten.index].fixiert = true;
            dragSimulationStarten(ereignis.pointerId);
          }
          if (gezogenerKnoten.aktiv) {
            gezogenerKnoten.zielX = gezogenerKnoten.ursprungX + dx;
            gezogenerKnoten.zielY = gezogenerKnoten.ursprungY + dy;
            gezogenerKnoten.element.dataset.fixiert = "true";
          }
          return;
        }
        if (!zieht) return;
        const dx = ereignis.clientX - letzterPunkt.x;
        const dy = ereignis.clientY - letzterPunkt.y;
        if (Math.hypot(
          ereignis.clientX - hintergrundStartPunkt.x,
          ereignis.clientY - hintergrundStartPunkt.y
        ) > 4) {
          hintergrundBewegt = true;
        }
        verschiebungX += dx;
        verschiebungY += dy;
        letzterPunkt = { x: ereignis.clientX, y: ereignis.clientY };
        transformationAnwenden();
      });

      function ziehenBeenden(ereignis) {
        if (ereignis?.pointerType === "touch") {
          vaultZeiger.delete(ereignis.pointerId);
          if (vaultPinch) {
            vaultPinch = null;
            zieht = false;
            hintergrundBewegt = false;
            letzterPunkt = null;
            hintergrundStartPunkt = null;
            viewport.classList.remove("zieht");
            return;
          }
        }
        if (gezogenerKnoten &&
            (!ereignis || ereignis.pointerId === gezogenerKnoten.pointerId)) {
          const { index, element, aktiv } = gezogenerKnoten;
          gezogenenKnotenPositionAnwenden();
          dragSimulationsLauf += 1;
          element.classList.remove("wird-gezogen");
          gezogenerKnoten = null;
          if (aktiv) {
            unterdrückterCoreKlick = index;
            graphElementeAktualisieren();
            window.setTimeout(() => {
              positionen[index].fixiert = false;
              element.dataset.fixiert = "false";
              simulationStarten({ schritte: 90 });
            }, 220);
          }
          return;
        }
        const warHintergrundZug = zieht;
        const warHintergrundBewegt = hintergrundBewegt;
        zieht = false;
        hintergrundBewegt = false;
        letzterPunkt = null;
        hintergrundStartPunkt = null;
        viewport.classList.remove("zieht");
        if (warHintergrundZug && !warHintergrundBewegt &&
            ereignis?.type === "pointerup") {
          coreMenüSchließen();
          bereichsfokusZurücksetzen();
        }
      }

      viewport.addEventListener("pointerup", ziehenBeenden);
      viewport.addEventListener("pointercancel", ziehenBeenden);
      window.addEventListener("resize", einpassen);
      einpassen();
      simulationStarten({ automatischEinpassen: true, schritte: 120 });

    })();
  </script>
</body>
</html>
