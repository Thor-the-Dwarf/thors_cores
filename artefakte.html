<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=10, user-scalable=yes">
  <title>Artefakte · TheRealDeal</title>
  <style>
    :root {
      color-scheme: dark;
      --hintergrund: #090d1b;
      --text: #f6f7fb;
      --linie: rgba(183, 195, 220, 0.2);
      --cyan: #46d7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background: var(--hintergrund);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .zurück {
      position: fixed;
      z-index: 2;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(180, 205, 239, 0.34);
      border-radius: 999px;
      color: rgba(246, 247, 251, 0.92);
      background: rgba(10, 14, 23, 0.88);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
      font-weight: 850;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .zurück:hover,
    .zurück:focus-visible {
      border-color: rgba(70, 215, 255, 0.7);
      outline: none;
    }

    .artefakte-raster {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .artefakt-bereich {
      grid-column: span 2;
      min-width: 0;
      min-height: 0;
      padding: clamp(22px, 4vw, 48px);
      display: grid;
      place-items: center;
      border: 0 solid var(--linie);
      border-right-width: 1px;
      border-bottom-width: 1px;
      background:
        radial-gradient(circle at 50% 38%, rgba(70, 215, 255, 0.06), transparent 65%),
        rgba(17, 27, 43, 0.78);
      text-align: center;
    }

    .artefakt-bereich:nth-child(5) {
      grid-column: 2 / span 2;
    }

    .artefakt-bereich:nth-child(2),
    .artefakt-bereich:nth-child(5),
    .artefakt-bereich:nth-child(7) {
      background:
        radial-gradient(circle at 50% 38%, rgba(156, 102, 239, 0.09), transparent 65%),
        rgba(20, 25, 43, 0.82);
    }

    .artefakt-bereich:nth-child(3),
    .artefakt-bereich:nth-child(4) {
      background:
        radial-gradient(circle at 50% 38%, rgba(37, 99, 235, 0.09), transparent 65%),
        rgba(14, 25, 43, 0.82);
    }

    .artefakt-bereich span {
      font-size: clamp(1.05rem, 2.3vw, 1.75rem);
      font-weight: 850;
      line-height: 1.2;
    }

    @media (max-width: 700px) {
      .artefakte-raster {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
      }

      .artefakt-bereich {
        grid-column: span 2;
        padding: 18px 12px;
      }

      .artefakt-bereich:nth-child(5) {
        grid-column: span 2;
      }

      .artefakt-bereich:nth-child(7) {
        grid-column: 2 / span 2;
      }

      .artefakt-bereich span {
        font-size: clamp(0.8rem, 3.8vw, 1.1rem);
      }
    }
  </style>
</head>
<body>
  <a class="zurück" href="index.html">← Vault</a>
  <main class="artefakte-raster" aria-label="Artefakte">
    <section class="artefakt-bereich"><span>Qualitätsvorgaben</span></section>
    <section class="artefakt-bereich"><span>Analyse-Tools</span></section>
    <section class="artefakt-bereich"><span>Planungs-Tools</span></section>
    <section class="artefakt-bereich"><span>Umsetzungs-Tools</span></section>
    <section class="artefakt-bereich"><span>Test-Tools</span></section>
    <section class="artefakt-bereich"><span>Abschluss-Tools</span></section>
    <section class="artefakt-bereich"><span>Wartungs-Tools</span></section>
  </main>
</body>
</html>
